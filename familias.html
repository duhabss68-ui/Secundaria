<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f4c5c">
<title>Mi Bitácora · Familias</title>
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ Mi Bitácora · Familias — estilos ============ */
  :root {
    --petroleo: #0f4c5c; --petroleo-2: #0b3a46; --turquesa: #1a9e9a; --ambar: #f2a541;
    --bg: #eef3f4; --card: #ffffff; --texto: #13232a; --suave: #566a71; --borde: #dbe5e7;
    --ok: #1d8049; --ok-bg: #e2f4e8; --pend: #9a6200; --pend-bg: #fdf0d8; --no: #b8352a; --no-bg: #fbe5e2;
    /* mensaje del maestro y observaciones */
    --msj-bg: #fff6e3; --msj-bg2: #ffe8b8; --msj-borde: #f2a541; --msj-texto: #3d2a00; --msj-eti: #8a5300;
    --obs-bg: #e6f5f4; --obs-borde: #1a9e9a; --obs-eti: #0d6b68;
    --sombra: 0 1px 2px rgba(15,76,92,.06), 0 6px 20px rgba(15,76,92,.08);
    --radio: 16px;
    --gutter: clamp(16px, 4vw, 32px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c181c; --card: #14252a; --texto: #e7eff1; --suave: #96aab0; --borde: #24393f;
      --ok: #62d394; --ok-bg: #163226; --pend: #f3bb5f; --pend-bg: #382b13; --no: #ff8f82; --no-bg: #3b1c19;
      --msj-bg: #3a2a0c; --msj-bg2: #4a3410; --msj-borde: #f2a541; --msj-texto: #fff1d6; --msj-eti: #ffcf7a;
      --obs-bg: #12343a; --obs-borde: #3cc4bf; --obs-eti: #7fe0db;
      --sombra: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c181c; --card: #14252a; --texto: #e7eff1; --suave: #96aab0; --borde: #24393f;
    --ok: #62d394; --ok-bg: #163226; --pend: #f3bb5f; --pend-bg: #382b13; --no: #ff8f82; --no-bg: #3b1c19;
    --msj-bg: #3a2a0c; --msj-bg2: #4a3410; --msj-borde: #f2a541; --msj-texto: #fff1d6; --msj-eti: #ffcf7a;
    --obs-bg: #12343a; --obs-borde: #3cc4bf; --obs-eti: #7fe0db;
    --sombra: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--texto);
    font: clamp(15px, 0.35vw + 14px, 17px)/1.5 "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--turquesa); outline-offset: 2px; }
  .ancho { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ---------- Logo ---------- */
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--ambar); display: grid; place-items: center; flex: none; overflow: hidden; }
  .logo svg { width: 100%; height: 100%; display: block; }

  /* ---------- Acceso ---------- */
  #acceso { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    width: 100%; max-width: 480px; margin: 0 auto; padding: 32px var(--gutter) calc(32px + env(safe-area-inset-bottom)); }
  .acceso-cab { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .acceso-cab h1 { margin: 0; font-size: clamp(1.2rem, 4.5vw, 1.45rem); line-height: 1.15; }
  .acceso-cab small { display: block; color: var(--suave); font-weight: 600; font-size: .85rem; }
  .tarjeta { background: var(--card); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: clamp(16px, 5vw, 24px); }
  label { font-weight: 700; display: block; margin-bottom: 8px; }
  .ayuda { color: var(--suave); font-size: .92rem; margin: 0 0 16px; }
  #codigo {
    width: 100%; font: 800 clamp(1.25rem, 6vw, 1.6rem)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .1em;
    text-align: center; text-transform: uppercase; padding: 14px 8px; border-radius: 12px;
    border: 2px solid var(--borde); background: var(--bg); color: var(--texto); outline: none;
  }
  #codigo:focus { border-color: var(--turquesa); }
  .check { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; font-size: .95rem; color: var(--suave); min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--turquesa); }
  .btn { width: 100%; min-height: 50px; border: 0; border-radius: 12px; padding: 14px; font-weight: 800; font-size: 1rem; background: var(--petroleo); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--no); background: var(--no-bg); border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-weight: 600; font-size: .92rem; }
  .privado { color: var(--suave); font-size: .8rem; text-align: center; margin-top: 18px; }

  /* ---------- Barra superior ---------- */
  .barra { position: sticky; top: 0; z-index: 5; background: var(--petroleo); color: #fff; padding-top: env(safe-area-inset-top); }
  .barra .ancho { display: flex; align-items: center; gap: 10px; min-height: 56px; }
  .barra .logo { width: 34px; height: 34px; border-radius: 9px; }
  .barra .logo svg { width: 100%; height: 100%; }
  .barra strong { flex: 1; min-width: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .salir { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 999px; padding: 0 16px; min-height: 38px; font-weight: 700; font-size: .88rem; cursor: pointer; flex: none; }

  /* ---------- Tablero: una columna en celular, dos en tablet y computadora ---------- */
  #contenido { padding-top: 16px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .tablero { display: grid; gap: 0 28px; grid-template-columns: minmax(0, 1fr); }
  .col { min-width: 0; }
  @media (min-width: 820px) {
    .tablero { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
    .col-b > h3:first-child { margin-top: 0; }
  }

  .alumno { background: linear-gradient(135deg, var(--petroleo), var(--turquesa)); color: #fff; border-radius: 20px; padding: clamp(16px, 4.5vw, 22px); }
  .alumno h2 { margin: 0; font-size: clamp(1.35rem, 5.5vw, 1.75rem); line-height: 1.15; overflow-wrap: anywhere; }
  .alumno .grupo { display: inline-block; margin-top: 8px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: .85rem; }
  .alumno .act { margin: 10px 0 0; font-size: .82rem; opacity: .92; }

  .resumen-titulo { margin: 16px 0 0; font-size: .78rem; color: var(--suave); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .resumen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(6px, 2vw, 10px); margin-top: 10px; }
  .cifra { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 4px; text-align: center; box-shadow: var(--sombra); }
  .cifra b { display: block; font-size: clamp(1.4rem, 6vw, 1.8rem); line-height: 1.1; }
  .cifra span { display: block; font-size: clamp(.7rem, 2.6vw, .8rem); color: var(--suave); font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .cifra.ok b { color: var(--ok); } .cifra.pend b { color: var(--pend); } .cifra.no b { color: var(--no); }

  h3 { font-size: 1.08rem; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  .vacio { color: var(--suave); font-size: .92rem; background: var(--card); border: 1px dashed var(--borde); border-radius: 14px; padding: 14px; text-align: center; }

  /* ---------- MENSAJE DEL MAESTRO (lo más visible después del nombre) ---------- */
  .mensaje {
    position: relative; margin-top: 16px; border-radius: 20px; padding: clamp(16px, 4.5vw, 22px);
    background: linear-gradient(140deg, var(--msj-bg), var(--msj-bg2)); color: var(--msj-texto);
    border: 2px solid var(--msj-borde); box-shadow: 0 8px 24px rgba(242,165,65,.25);
  }
  .msj-cab { display: flex; align-items: center; gap: 12px; }
  .msj-ico { width: 46px; height: 46px; border-radius: 50%; background: var(--ambar); display: grid; place-items: center; flex: none; font-size: 1.4rem; box-shadow: 0 0 0 5px rgba(242,165,65,.25); }
  .msj-quien { flex: 1; min-width: 0; }
  .msj-eti { display: block; font-weight: 900; font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--msj-eti); }
  .msj-quien small { display: block; font-weight: 700; font-size: .85rem; opacity: .85; }
  .msj-txt { margin: 14px 0 0; font-size: clamp(1.05rem, 3.8vw, 1.2rem); font-weight: 700; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
  .mensaje > .nuevo { position: absolute; top: -12px; right: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .nuevo { flex: none; background: #c2410c; color: #fff; font-weight: 900; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; animation: latido 2s ease-in-out 3; }
  @keyframes latido { 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .nuevo { animation: none; } }

  /* aviso: hay observaciones en las actividades */
  .aviso-obs {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; text-align: left; cursor: pointer;
    background: var(--obs-bg); color: var(--texto); border: 2px solid var(--obs-borde); border-radius: 16px; padding: 12px 14px; font-size: .98rem;
  }
  .aviso-obs .n { flex: none; min-width: 34px; height: 34px; border-radius: 50%; background: var(--obs-borde); color: #fff; display: grid; place-items: center; font-weight: 900; }
  .aviso-obs span { flex: 1; min-width: 0; } .aviso-obs b { color: var(--obs-eti); }
  .aviso-obs .ir { flex: none; font-weight: 800; color: var(--obs-eti); white-space: nowrap; }

  /* ---------- Anuncios ---------- */
  .anuncio { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--borde); border-left: 6px solid var(--turquesa); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--sombra); }
  .anuncio.tarea { border-left-color: var(--ambar); } .anuncio.evento { border-left-color: var(--petroleo); } .anuncio.reunion { border-left-color: #7c3aed; }
  .an-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
  .an-cuerpo { flex: 1; min-width: 0; }
  .anuncio .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; font-size: .78rem; color: var(--suave); font-weight: 700; }
  .anuncio .chip { text-transform: uppercase; letter-spacing: .05em; font-weight: 900; }
  .anuncio h4 { margin: 3px 0 4px; font-size: 1.05rem; line-height: 1.3; overflow-wrap: anywhere; }
  .anuncio p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .anuncio .nuevo { animation: none; font-size: .65rem; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }

  /* ---------- Actividades ---------- */
  details.semana { background: var(--card); border: 1px solid var(--borde); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--sombra); overflow: hidden; }
  details.semana summary { list-style: none; cursor: pointer; padding: 14px 16px; min-height: 52px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
  details.semana summary::-webkit-details-marker { display: none; }
  details.semana summary .tit { flex: 1; min-width: 0; }
  details.semana summary .cuenta { font-size: .8rem; color: var(--suave); font-weight: 800; white-space: nowrap; }
  details.semana summary .tiene-obs { font-size: .9rem; }
  details.semana summary::after { content: "›"; font-size: 1.5rem; line-height: 1; color: var(--suave); transition: transform .2s; }
  details.semana[open] summary::after { transform: rotate(90deg); }
  .act-lista { list-style: none; margin: 0; padding: 0 clamp(8px, 3vw, 14px) 10px; }
  .act-item { display: flex; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--borde); }
  .icono { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 900; font-size: .95rem; }
  .icono.ok { background: var(--ok-bg); color: var(--ok); } .icono.pend { background: var(--pend-bg); color: var(--pend); } .icono.no { background: var(--no-bg); color: var(--no); }
  .act-cuerpo { flex: 1; min-width: 0; }
  .act-top { display: flex; align-items: flex-start; gap: 10px; }
  .act-nombre { flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere; line-height: 1.3; }
  .calif { flex: none; font-weight: 900; font-size: 1rem; color: var(--texto); background: var(--bg); border: 1.5px solid var(--borde); border-radius: 10px; padding: 2px 10px; white-space: nowrap; }
  .act-sub { font-size: .82rem; color: var(--suave); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .estado-txt.ok { color: var(--ok); font-weight: 800; } .estado-txt.pend { color: var(--pend); font-weight: 800; } .estado-txt.no { color: var(--no); font-weight: 800; }
  .nivel { border-radius: 999px; padding: 1px 9px; font-weight: 800; font-size: .75rem; border: 1.5px solid currentColor; }
  .nivel.apoyo { color: var(--no); } .nivel.proceso { color: var(--pend); } .nivel.esperado { color: var(--ok); } .nivel.otro { color: var(--suave); }

  /* OBSERVACIÓN del maestro dentro de cada actividad */
  .obs { margin-top: 10px; background: var(--obs-bg); border-left: 5px solid var(--obs-borde); border-radius: 0 12px 12px 0; padding: 10px 12px; scroll-margin-top: 80px; }
  .obs-eti { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--obs-eti); }
  .obs p { margin: 4px 0 0; font-size: .98rem; font-weight: 600; color: var(--texto); white-space: pre-line; overflow-wrap: anywhere; }
  .obs.destello { animation: destello 1.6s ease-out 1; }
  @keyframes destello { 0% { box-shadow: 0 0 0 6px rgba(26,158,154,.55); } 100% { box-shadow: 0 0 0 0 rgba(26,158,154,0); } }

  .demo { background: var(--ambar); color: #3a2600; text-align: center; font-weight: 800; font-size: .8rem; padding: 6px 12px; }
  .pie { color: var(--suave); font-size: .78rem; text-align: center; margin-top: 30px; grid-column: 1 / -1; }

  /* Pantallas muy angostas (≤ 340 px): números del resumen más compactos */
  @media (max-width: 420px) { .cuenta-txt { display: none; } }
  @media (max-width: 340px) {
    .cifra { padding: 10px 2px; }
    .msj-ico { width: 40px; height: 40px; font-size: 1.2rem; }
    .aviso-obs .ir { display: none; }
  }
  /* Celular acostado: aprovecha el ancho */
  @media (orientation: landscape) and (max-height: 500px) {
    #acceso { justify-content: flex-start; }
  }
  @media print {
    .barra, .salir, .aviso-obs, .demo { display: none !important; }
    details.semana:not([open]) .act-lista { display: block; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<div id="aviso-demo" class="demo" hidden>Modo de prueba · los datos no son reales</div>

<!-- ================= Acceso ================= -->
<main id="acceso">
  <div class="acceso-cab">
    <div class="logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#FFC93C"/><path d="M30 24 L32 30 L38 32 L32 34 L30 40 L28 34 L22 32 L28 30 Z" fill="#FFFFFF"/><circle cx="46" cy="28" r="3" fill="#FF6F61"/><rect x="18" y="93" width="84" height="5" rx="2.5" fill="#33284D"/><g stroke="#33284D" stroke-width="2.5" stroke-linejoin="round"><rect x="23" y="66" width="14" height="26" rx="3" fill="#2F6FC0"/><path d="M23 80 V69 A3 3 0 0 1 26 66 H34 A3 3 0 0 1 37 69 V80 Z" fill="#FF9F43"/><rect x="43" y="62" width="14" height="30" rx="2" fill="#F5A300"/><rect x="48.5" y="63" width="3" height="19" fill="#FFE08A" stroke="none"/><rect x="43" y="82" width="14" height="6" fill="#C9D1D6"/><rect x="43" y="88" width="14" height="4" rx="2" fill="#FF8FA3"/><path d="M43 62 L57 62 L50 50 Z" fill="#FFF8E7"/><rect x="63" y="46" width="14" height="46" rx="5" fill="#A29BFE"/><rect x="63" y="46" width="14" height="11" fill="#FFFFFF"/><path d="M63 46 L77 46 L70 36 Z" fill="#FFFFFF"/><rect x="83" y="30" width="14" height="62" rx="5" fill="#2EC4B6"/><rect x="83" y="72" width="14" height="8" fill="#FFFFFF"/><path d="M84.5 30 L95.5 30 L93 24 L87 24 Z" fill="#FFFFFF"/><path d="M87 24 L93 24 L93 19 L87 21.5 Z" fill="#2EC4B6"/></g><path d="M47.67 54 L52.33 54 L50 50 Z" fill="#33284D"/><path d="M67.9 39 L72.1 39 L70 36 Z" fill="#33284D"/><rect x="77" y="70" width="3" height="16" rx="1.5" fill="#33284D"/></svg>
    </div>
    <div>
      <h1>Mi Bitácora · Familias</h1>
      <small>Prof. Nicolás Contreras Medina</small>
    </div>
  </div>

  <form id="form-acceso" class="tarjeta" autocomplete="off">
    <label for="codigo">Código de su hijo o hija</label>
    <p class="ayuda">Está en la tarjeta que le entregó el maestro. También puede escanear el código QR.</p>
    <input id="codigo" inputmode="text" maxlength="9" placeholder="XXXX-XXXX" spellcheck="false" autocapitalize="characters" aria-describedby="error">
    <label class="check"><input type="checkbox" id="recordar" checked> Recordar en este celular</label>
    <button class="btn" id="btn-entrar" type="submit">Entrar</button>
    <div id="error" class="error" role="alert" hidden></div>
  </form>
  <p class="privado">Información confidencial. Cada código muestra solo los datos de un alumno.</p>
</main>

<!-- ================= Panel ================= -->
<div id="panel" hidden>
  <header class="barra">
    <div class="ancho">
      <div class="logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#FFC93C"/><path d="M30 24 L32 30 L38 32 L32 34 L30 40 L28 34 L22 32 L28 30 Z" fill="#FFFFFF"/><circle cx="46" cy="28" r="3" fill="#FF6F61"/><rect x="18" y="93" width="84" height="5" rx="2.5" fill="#33284D"/><g stroke="#33284D" stroke-width="2.5" stroke-linejoin="round"><rect x="23" y="66" width="14" height="26" rx="3" fill="#2F6FC0"/><path d="M23 80 V69 A3 3 0 0 1 26 66 H34 A3 3 0 0 1 37 69 V80 Z" fill="#FF9F43"/><rect x="43" y="62" width="14" height="30" rx="2" fill="#F5A300"/><rect x="48.5" y="63" width="3" height="19" fill="#FFE08A" stroke="none"/><rect x="43" y="82" width="14" height="6" fill="#C9D1D6"/><rect x="43" y="88" width="14" height="4" rx="2" fill="#FF8FA3"/><path d="M43 62 L57 62 L50 50 Z" fill="#FFF8E7"/><rect x="63" y="46" width="14" height="46" rx="5" fill="#A29BFE"/><rect x="63" y="46" width="14" height="11" fill="#FFFFFF"/><path d="M63 46 L77 46 L70 36 Z" fill="#FFFFFF"/><rect x="83" y="30" width="14" height="62" rx="5" fill="#2EC4B6"/><rect x="83" y="72" width="14" height="8" fill="#FFFFFF"/><path d="M84.5 30 L95.5 30 L93 24 L87 24 Z" fill="#FFFFFF"/><path d="M87 24 L93 24 L93 19 L87 21.5 Z" fill="#2EC4B6"/></g><path d="M47.67 54 L52.33 54 L50 50 Z" fill="#33284D"/><path d="M67.9 39 L72.1 39 L70 36 Z" fill="#33284D"/><rect x="77" y="70" width="3" height="16" rx="1.5" fill="#33284D"/></svg>
      </div>
      <strong>Mi Bitácora · Familias</strong>
      <button class="salir" id="btn-salir" type="button">Salir</button>
    </div>
  </header>
  <main class="ancho" id="contenido"></main>
</div>

<script>
/* =====================================================================
   1) Pega aquí la URL de tu Apps Script (la que termina en /exec).
      Mientras esté vacía, la página funciona en MODO DE PRUEBA.
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz_G4QxXSxUk5te4CnjoqtNezfYgtZwApxCLxXF1c5HRh_wA1VCxiJDPebohdj5ymHuSQ/exec';

const LLAVE = 'mb_familias_codigo';
const params = new URLSearchParams(location.search);
const DEMO = !API_URL || params.has('demo');
const $ = s => document.querySelector(s);

/* ---------- Utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sinAcentos = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const normCodigo = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtCodigo = s => { const n = normCodigo(s).slice(0, 8); return n.length > 4 ? n.slice(0, 4) + '-' + n.slice(4) : n; };

function aFecha(iso) {
  if (!iso) return null;
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  return y ? new Date(y, m - 1, d) : null;
}
function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function lunesDe(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const fDia = new Intl.DateTimeFormat('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
const fCorta = new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long' });
const fHora = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });

function etiquetaSemana(lunes) {
  const hoy = lunesDe(new Date()).getTime();
  const dif = Math.round((hoy - lunes.getTime()) / (7 * 864e5));
  const viernes = new Date(lunes.getTime() + 4 * 864e5);
  const rango = lunes.getMonth() === viernes.getMonth()
    ? lunes.getDate() + ' al ' + fCorta.format(viernes)
    : fCorta.format(lunes) + ' al ' + fCorta.format(viernes);
  if (dif === 0) return 'Esta semana · ' + rango;
  if (dif === 1) return 'Semana pasada · ' + rango;
  return 'Semana del ' + rango;
}

function estadoDe(s) {
  const t = sinAcentos(s).trim();
  if (/^no|no.?entreg|sin.?entreg|falt/.test(t)) return 'no';
  if (/entreg|complet|hecho|^si$|^ok$/.test(t)) return 'ok';
  return 'pend';
}
const ESTADO = { ok: ['✓', 'Entregó'], pend: ['•', 'Pendiente'], no: ['✕', 'No entregó'] };

function nivelDe(s) {
  const t = sinAcentos(s);
  if (!t.trim()) return null;
  if (/apoyo/.test(t)) return ['apoyo', 'Requiere apoyo'];
  if (/proceso/.test(t)) return ['proceso', 'En proceso'];
  if (/esperado|logrado|destacado/.test(t)) return ['esperado', 'Nivel esperado'];
  return ['otro', String(s)];
}

function guardar(c) { try { localStorage.setItem(LLAVE, c); } catch (e) {} }
function recuperar() { try { return localStorage.getItem(LLAVE) || ''; } catch (e) { return ''; } }
function olvidar() { try { localStorage.removeItem(LLAVE); } catch (e) {} }

/* ---------- Datos ---------- */
async function consultar(codigo) {
  if (DEMO) return datosDemo(codigo);
  const r = await fetch(API_URL + '?codigo=' + encodeURIComponent(codigo), { method: 'GET', cache: 'no-store' });
  if (!r.ok) throw new Error('red');
  return r.json();
}

function datosDemo(codigo) {
  const lunes = lunesDe(new Date());
  const dia = k => isoLocal(new Date(lunes.getTime() + k * 864e5));
  return new Promise(res => setTimeout(() => res({
    ok: true,
    alumno: { nombre: 'Ana P.', grupo: '2A' },
    actualizado: isoLocal(new Date()) + 'T18:30',
    nota: { texto: 'Muy buena participación en su equipo esta semana. Le falta entregar el guion final.', fecha: dia(3) },
    anuncios: [
      { fecha: dia(0), tipo: 'Material', titulo: 'Audífonos para el podcast', texto: 'A partir del miércoles traer audífonos con cable para editar en Audacity.' },
      { fecha: dia(0), tipo: 'Tarea', titulo: 'Guion final del podcast', texto: 'Entregar el guion impreso el jueves. Mínimo una cuartilla, con nombres del equipo.' },
      { fecha: dia(-2), tipo: 'Evento', titulo: 'Festival de noviembre', texto: 'Los mejores podcasts se presentarán en el festival. Están invitados.' },
    ],
    actividades: [
      { fecha: dia(3), actividad: 'Guion del podcast (final)', tipo: 'Proyecto', estado: 'pendiente', nivel: '' },
      { fecha: dia(2), actividad: 'Edición: cortar silencios y ruido', tipo: 'Práctica', estado: 'entregado', calificacion: '7 / 10', nivel: 'En proceso', comentario: 'Le costó usar la herramienta de reducción de ruido.' },
      { fecha: dia(0), actividad: 'Guion del podcast (borrador)', tipo: 'Proyecto', estado: 'entregado', calificacion: '9 / 10', nivel: 'Nivel esperado' },
      { fecha: dia(-3), actividad: 'Práctica 4: grabar voces en Audacity', tipo: 'Práctica', estado: 'entregado', nivel: 'Nivel esperado' },
      { fecha: dia(-5), actividad: 'Mapa mental: historia de Xalisco', tipo: 'Clase', estado: 'no_entregado', nivel: '', comentario: 'No lo entregó en clase. Puede traerlo el lunes para revisión.' },
      { fecha: dia(-7), actividad: 'Investigación: origen del Día de Muertos', tipo: 'Tarea', estado: 'entregado', nivel: 'Nivel esperado' },
    ],
  }), 350));
}

/* ---------- Pantallas ---------- */
function mostrarAcceso(msg) {
  $('#panel').hidden = true;
  $('#acceso').hidden = false;
  const e = $('#error');
  e.hidden = !msg; e.textContent = msg || '';
}

const MAESTRO = 'Prof. Nicolás Contreras Medina';
const ICONO_ANUNCIO = { tarea: '📝', material: '🎒', evento: '🎉', reunion: '👥', aviso: '📢' };
const esReciente = (f, dias) => f && (Date.now() - f.getTime()) / 864e5 <= dias;

function render(d) {
  const acts = (d.actividades || []).map((a, i) => ({ ...a, i, f: aFecha(a.fecha), e: estadoDe(a.estado) }));

  // Agrupa por semana (de lunes a domingo)
  const semanas = new Map();
  acts.forEach(a => {
    const k = a.f ? isoLocal(lunesDe(a.f)) : 'sin-fecha';
    if (!semanas.has(k)) semanas.set(k, []);
    semanas.get(k).push(a);
  });
  const claves = [...semanas.keys()].sort().reverse();
  const reciente = claves.length ? semanas.get(claves[0]) : [];
  const cuenta = t => reciente.filter(a => a.e === t).length;
  const tituloResumen = claves.length && claves[0] !== 'sin-fecha' ? etiquetaSemana(aFecha(claves[0])) : 'Actividades';
  const conObs = acts.filter(a => String(a.comentario || '').trim());

  let act = '';
  if (d.actualizado) {
    const [f, h] = String(d.actualizado).split('T');
    const fecha = aFecha(f);
    if (fecha && h) { const [hh, mm] = h.split(':').map(Number); fecha.setHours(hh || 0, mm || 0); }
    if (fecha) act = 'Actualizado el ' + fHora.format(fecha);
  }

  const A = [], B = [];

  A.push(`
    <section class="alumno">
      <h2>${esc(d.alumno.nombre)}</h2>
      <span class="grupo">Grupo ${esc(d.alumno.grupo)}</span>
      ${act ? `<p class="act">${esc(act)}</p>` : ''}
    </section>`);

  // 1) Mensaje del maestro: lo primero que se ve
  if (d.nota && d.nota.texto) {
    const f = aFecha(d.nota.fecha);
    A.push(`
      <section class="mensaje" role="note" aria-label="Mensaje del maestro">
        <div class="msj-cab">
          <span class="msj-ico" aria-hidden="true">✉️</span>
          <div class="msj-quien"><span class="msj-eti">Mensaje del maestro</span><small>${esc(MAESTRO)}</small>${f ? `<small>${esc(fDia.format(f))}</small>` : ''}</div>
        </div>
        ${esReciente(f, 7) ? '<span class="nuevo">Nuevo</span>' : ''}
        <p class="msj-txt">${esc(d.nota.texto)}</p>
      </section>`);
  }

  // 2) Aviso de observaciones en actividades
  if (conObs.length) {
    const n = conObs.length;
    A.push(`
      <button class="aviso-obs" type="button" id="ir-obs">
        <span class="n" aria-hidden="true">${n}</span>
        <span>El maestro dejó <b>${n === 1 ? 'una observación' : n + ' observaciones'}</b> en ${n === 1 ? 'una actividad' : 'las actividades'}.</span>
        <span class="ir">Ver ↓</span>
      </button>`);
  }

  // 3) Resumen
  if (reciente.length) {
    A.push(`
      <p class="resumen-titulo">${esc(tituloResumen)}</p>
      <section class="resumen" aria-label="Resumen de la semana">
        <div class="cifra ok"><b>${cuenta('ok')}</b><span>Entregadas</span></div>
        <div class="cifra pend"><b>${cuenta('pend')}</b><span>Pendientes</span></div>
        <div class="cifra no"><b>${cuenta('no')}</b><span>Sin entregar</span></div>
      </section>`);
  }

  // 4) Anuncios
  A.push('<h3>📢 Anuncios</h3>');
  if ((d.anuncios || []).length) {
    d.anuncios.forEach(a => {
      const tipo = sinAcentos(a.tipo);
      const clave = /tarea/.test(tipo) ? 'tarea' : /evento/.test(tipo) ? 'evento' : /reunion/.test(tipo) ? 'reunion' : /material/.test(tipo) ? 'material' : 'aviso';
      const f = aFecha(a.fecha);
      A.push(`
        <article class="anuncio ${clave}">
          <span class="an-ico" aria-hidden="true">${ICONO_ANUNCIO[clave]}</span>
          <div class="an-cuerpo">
            <div class="meta"><span class="chip">${esc(a.tipo || 'Aviso')}${esReciente(f, 3) ? '<span class="nuevo">Nuevo</span>' : ''}</span><span>${f ? esc(fDia.format(f)) : ''}</span></div>
            <h4>${esc(a.titulo)}</h4>
            ${a.texto ? `<p>${esc(a.texto)}</p>` : ''}
          </div>
        </article>`);
    });
  } else {
    A.push('<div class="vacio">No hay anuncios por ahora.</div>');
  }

  // 5) Actividades por semana (columna derecha en pantallas grandes)
  B.push('<h3>📚 Actividades</h3>');
  if (!claves.length) {
    B.push('<div class="vacio">Aún no hay actividades publicadas.</div>');
  } else {
    claves.forEach((k, i) => {
      const lista = semanas.get(k).sort((x, y) => (y.f || 0) - (x.f || 0));
      const ent = lista.filter(a => a.e === 'ok').length;
      const obsSemana = lista.some(a => String(a.comentario || '').trim());
      const titulo = k === 'sin-fecha' ? 'Sin fecha' : etiquetaSemana(aFecha(k));
      B.push(`
        <details class="semana" ${i === 0 || obsSemana ? 'open' : ''}>
          <summary><span class="tit">${esc(titulo)}</span>${obsSemana ? '<span class="tiene-obs" title="Tiene observaciones">💬</span>' : ''}<span class="cuenta">${ent}/${lista.length}<span class="cuenta-txt"> entregadas</span></span></summary>
          <ul class="act-lista">
            ${lista.map(a => {
              const [ic, txt] = ESTADO[a.e];
              const nv = nivelDe(a.nivel);
              const obs = String(a.comentario || '').trim();
              return `
              <li class="act-item">
                <span class="icono ${a.e}" aria-hidden="true">${ic}</span>
                <div class="act-cuerpo">
                  <div class="act-top">
                    <div class="act-nombre">${esc(a.actividad)}</div>
                    ${a.calificacion ? `<span class="calif" title="Calificación">${esc(a.calificacion)}</span>` : ''}
                  </div>
                  <div class="act-sub">
                    <span class="estado-txt ${a.e}">${txt}</span>
                    ${a.f ? `<span>${esc(fDia.format(a.f))}</span>` : ''}
                    ${a.tipo ? `<span>${esc(a.tipo)}</span>` : ''}
                    ${nv ? `<span class="nivel ${nv[0]}">${esc(nv[1])}</span>` : ''}
                  </div>
                  ${obs ? `<div class="obs" id="obs-${a.i}"><span class="obs-eti">💬 Observación del maestro</span><p>${esc(obs)}</p></div>` : ''}
                </div>
              </li>`;
            }).join('')}
          </ul>
        </details>`);
    });
  }

  $('#contenido').innerHTML = `
    <div class="tablero">
      <div class="col col-a">${A.join('')}</div>
      <div class="col col-b">${B.join('')}</div>
      <p class="pie">Si tiene dudas, comuníquese directamente con el maestro.<br>Información confidencial para la familia del alumno.</p>
    </div>`;

  const ir = $('#ir-obs');
  if (ir) ir.addEventListener('click', () => {
    const o = document.querySelector('.obs');
    if (!o) return;
    const det = o.closest('details'); if (det) det.open = true;
    o.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    o.classList.remove('destello'); void o.offsetWidth; o.classList.add('destello');
  });

  $('#acceso').hidden = true;
  $('#panel').hidden = false;
  window.scrollTo(0, 0);
}

async function entrar(codigo) {
  const c = fmtCodigo(codigo);
  if (normCodigo(c).length !== 8) { mostrarAcceso('El código tiene 8 letras y números, por ejemplo K7PQ-29XM.'); return; }
  const btn = $('#btn-entrar');
  btn.disabled = true; btn.textContent = 'Consultando…';
  $('#error').hidden = true;
  try {
    const d = await consultar(c);
    if (!d || !d.ok) { olvidar(); mostrarAcceso((d && d.error) || 'Código no válido.'); return; }
    if ($('#recordar').checked) guardar(c); else olvidar();
    render(d);
  } catch (e) {
    mostrarAcceso('No se pudo conectar. Revise su internet e intente de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

/* ---------- Eventos ---------- */
$('#codigo').addEventListener('input', e => {
  const v = fmtCodigo(e.target.value);
  if (v !== e.target.value) e.target.value = v;
});
$('#form-acceso').addEventListener('submit', e => { e.preventDefault(); entrar($('#codigo').value); });
$('#btn-salir').addEventListener('click', () => { olvidar(); $('#codigo').value = ''; mostrarAcceso(''); });

/* ---------- Inicio ---------- */
if (DEMO) $('#aviso-demo').hidden = false;
(function inicio() {
  // El QR trae ?c=CODIGO; se quita de la barra para que no quede en el historial
  const delQR = params.get('c');
  if (delQR) {
    params.delete('c');
    const resto = params.toString();
    history.replaceState(null, '', location.pathname + (resto ? '?' + resto : ''));
  }
  const c = delQR || recuperar();
  if (c) { $('#codigo').value = fmtCodigo(c); entrar(c); }
})();
</script>
</body>

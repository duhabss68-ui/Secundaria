<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f4c5c">
<title>Mi Bitácora · Familias</title>
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ Mi Bitácora · Familias — estilos ============ */
  :root {
    --petroleo: #0f4c5c; --petroleo-2: #0b3a46; --turquesa: #1a9e9a; --ambar: #f2a541;
    --bg: #eef3f4; --card: #ffffff; --texto: #13232a; --suave: #566a71; --borde: #dbe5e7;
    --ok: #1d8049; --ok-bg: #e2f4e8; --pend: #9a6200; --pend-bg: #fdf0d8; --no: #b8352a; --no-bg: #fbe5e2;
    /* mensaje del maestro y observaciones */
    --msj-bg: #fff6e3; --msj-bg2: #ffe8b8; --msj-borde: #f2a541; --msj-texto: #3d2a00; --msj-eti: #8a5300;
    --obs-bg: #e6f5f4; --obs-borde: #1a9e9a; --obs-eti: #0d6b68;
    --sombra: 0 1px 2px rgba(15,76,92,.06), 0 6px 20px rgba(15,76,92,.08);
    --radio: 16px;
    --gutter: clamp(16px, 4vw, 32px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c181c; --card: #14252a; --texto: #e7eff1; --suave: #96aab0; --borde: #24393f;
      --ok: #62d394; --ok-bg: #163226; --pend: #f3bb5f; --pend-bg: #382b13; --no: #ff8f82; --no-bg: #3b1c19;
      --msj-bg: #3a2a0c; --msj-bg2: #4a3410; --msj-borde: #f2a541; --msj-texto: #fff1d6; --msj-eti: #ffcf7a;
      --obs-bg: #12343a; --obs-borde: #3cc4bf; --obs-eti: #7fe0db;
      --sombra: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c181c; --card: #14252a; --texto: #e7eff1; --suave: #96aab0; --borde: #24393f;
    --ok: #62d394; --ok-bg: #163226; --pend: #f3bb5f; --pend-bg: #382b13; --no: #ff8f82; --no-bg: #3b1c19;
    --msj-bg: #3a2a0c; --msj-bg2: #4a3410; --msj-borde: #f2a541; --msj-texto: #fff1d6; --msj-eti: #ffcf7a;
    --obs-bg: #12343a; --obs-borde: #3cc4bf; --obs-eti: #7fe0db;
    --sombra: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--texto);
    font: clamp(15px, 0.35vw + 14px, 17px)/1.5 "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--turquesa); outline-offset: 2px; }
  .ancho { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ---------- Logo ---------- */
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--ambar); display: grid; place-items: center; flex: none; overflow: hidden; }
  .logo svg { width: 100%; height: 100%; display: block; }

  /* ---------- Acceso ---------- */
  #acceso { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    width: 100%; max-width: 480px; margin: 0 auto; padding: 32px var(--gutter) calc(32px + env(safe-area-inset-bottom)); }
  .acceso-cab { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .acceso-cab h1 { margin: 0; font-size: clamp(1.2rem, 4.5vw, 1.45rem); line-height: 1.15; }
  .acceso-cab small { display: block; color: var(--suave); font-weight: 600; font-size: .85rem; }
  .tarjeta { background: var(--card); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: clamp(16px, 5vw, 24px); }
  label { font-weight: 700; display: block; margin-bottom: 8px; }
  .ayuda { color: var(--suave); font-size: .92rem; margin: 0 0 16px; }
  #codigo {
    width: 100%; font: 800 clamp(1.25rem, 6vw, 1.6rem)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .1em;
    text-align: center; text-transform: uppercase; padding: 14px 8px; border-radius: 12px;
    border: 2px solid var(--borde); background: var(--bg); color: var(--texto); outline: none;
  }
  #codigo:focus { border-color: var(--turquesa); }
  .check { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; font-size: .95rem; color: var(--suave); min-height: 44px; }
  .check input { width: 20px; height: 20px; accent-color: var(--turquesa); }
  .btn { width: 100%; min-height: 50px; border: 0; border-radius: 12px; padding: 14px; font-weight: 800; font-size: 1rem; background: var(--petroleo); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--no); background: var(--no-bg); border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-weight: 600; font-size: .92rem; }
  .privado { color: var(--suave); font-size: .8rem; text-align: center; margin-top: 18px; }

  /* ---------- Barra superior ---------- */
  .barra { position: sticky; top: 0; z-index: 5; background: var(--petroleo); color: #fff; padding-top: env(safe-area-inset-top); }
  .barra .ancho { display: flex; align-items: center; gap: 10px; min-height: 56px; }
  .barra .logo { width: 34px; height: 34px; border-radius: 9px; }
  .barra .logo svg { width: 100%; height: 100%; }
  .barra strong { flex: 1; min-width: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .salir { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 999px; padding: 0 16px; min-height: 38px; font-weight: 700; font-size: .88rem; cursor: pointer; flex: none; }

  /* ---------- Tablero: una columna en celular, dos en tablet y computadora ---------- */
  #contenido { padding-top: 16px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .tablero { display: grid; gap: 0 28px; grid-template-columns: minmax(0, 1fr); }
  .col { min-width: 0; }
  @media (min-width: 820px) {
    .tablero { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
    .col-b > h3:first-child { margin-top: 0; }
  }

  .alumno { background: linear-gradient(135deg, var(--petroleo), var(--turquesa)); color: #fff; border-radius: 20px; padding: clamp(16px, 4.5vw, 22px); }
  .alumno h2 { margin: 0; font-size: clamp(1.35rem, 5.5vw, 1.75rem); line-height: 1.15; overflow-wrap: anywhere; }
  .alumno .grupo { display: inline-block; margin-top: 8px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: .85rem; }
  .alumno .act { margin: 10px 0 0; font-size: .82rem; opacity: .92; }

  .resumen-titulo { margin: 16px 0 0; font-size: .78rem; color: var(--suave); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .resumen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(6px, 2vw, 10px); margin-top: 10px; }
  .cifra { background: var(--card); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 4px; text-align: center; box-shadow: var(--sombra); }
  .cifra b { display: block; font-size: clamp(1.4rem, 6vw, 1.8rem); line-height: 1.1; }
  .cifra span { display: block; font-size: clamp(.7rem, 2.6vw, .8rem); color: var(--suave); font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .cifra.ok b { color: var(--ok); } .cifra.pend b { color: var(--pend); } .cifra.no b { color: var(--no); }

  h3 { font-size: 1.08rem; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  .vacio { color: var(--suave); font-size: .92rem; background: var(--card); border: 1px dashed var(--borde); border-radius: 14px; padding: 14px; text-align: center; }

  /* ---------- MENSAJE DEL MAESTRO (lo más visible después del nombre) ---------- */
  .mensaje {
    position: relative; margin-top: 16px; border-radius: 20px; padding: clamp(16px, 4.5vw, 22px);
    background: linear-gradient(140deg, var(--msj-bg), var(--msj-bg2)); color: var(--msj-texto);
    border: 2px solid var(--msj-borde); box-shadow: 0 8px 24px rgba(242,165,65,.25);
  }
  .msj-cab { display: flex; align-items: center; gap: 12px; }
  .msj-ico { width: 46px; height: 46px; border-radius: 50%; background: var(--ambar); display: grid; place-items: center; flex: none; font-size: 1.4rem; box-shadow: 0 0 0 5px rgba(242,165,65,.25); }
  .msj-quien { flex: 1; min-width: 0; }
  .msj-eti { display: block; font-weight: 900; font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--msj-eti); }
  .msj-quien small { display: block; font-weight: 700; font-size: .85rem; opacity: .85; }
  .msj-txt { margin: 14px 0 0; font-size: clamp(1.05rem, 3.8vw, 1.2rem); font-weight: 700; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
  .mensaje > .nuevo { position: absolute; top: -12px; right: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .nuevo { flex: none; background: #c2410c; color: #fff; font-weight: 900; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; animation: latido 2s ease-in-out 3; }
  @keyframes latido { 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .nuevo { animation: none; } }

  /* aviso: hay observaciones en las actividades */
  .aviso-obs {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; text-align: left; cursor: pointer;
    background: var(--obs-bg); color: var(--texto); border: 2px solid var(--obs-borde); border-radius: 16px; padding: 12px 14px; font-size: .98rem;
  }
  .aviso-obs .n { flex: none; min-width: 34px; height: 34px; border-radius: 50%; background: var(--obs-borde); color: #fff; display: grid; place-items: center; font-weight: 900; }
  .aviso-obs span { flex: 1; min-width: 0; } .aviso-obs b { color: var(--obs-eti); }
  .aviso-obs .ir { flex: none; font-weight: 800; color: var(--obs-eti); white-space: nowrap; }

  /* ---------- Anuncios ---------- */
  .anuncio { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--borde); border-left: 6px solid var(--turquesa); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--sombra); }
  .anuncio.tarea { border-left-color: var(--ambar); } .anuncio.evento { border-left-color: var(--petroleo); } .anuncio.reunion { border-left-color: #7c3aed; }
  .an-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
  .an-cuerpo { flex: 1; min-width: 0; }
  .anuncio .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; font-size: .78rem; color: var(--suave); font-weight: 700; }
  .anuncio .chip { text-transform: uppercase; letter-spacing: .05em; font-weight: 900; }
  .anuncio h4 { margin: 3px 0 4px; font-size: 1.05rem; line-height: 1.3; overflow-wrap: anywhere; }
  .anuncio p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
  .anuncio .nuevo { animation: none; font-size: .65rem; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }

  /* ---------- Actividades ---------- */
  details.semana { background: var(--card); border: 1px solid var(--borde); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--sombra); overflow: hidden; }
  details.semana summary { list-style: none; cursor: pointer; padding: 14px 16px; min-height: 52px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
  details.semana summary::-webkit-details-marker { display: none; }
  details.semana summary .tit { flex: 1; min-width: 0; }
  details.semana summary .cuenta { font-size: .8rem; color: var(--suave); font-weight: 800; white-space: nowrap; }
  details.semana summary .tiene-obs { font-size: .9rem; }
  details.semana summary::after { content: "›"; font-size: 1.5rem; line-height: 1; color: var(--suave); transition: transform .2s; }
  details.semana[open] summary::after { transform: rotate(90deg); }
  .act-lista { list-style: none; margin: 0; padding: 0 clamp(8px, 3vw, 14px) 10px; }
  .act-item { display: flex; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--borde); }
  .icono { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 900; font-size: .95rem; }
  .icono.ok { background: var(--ok-bg); color: var(--ok); } .icono.pend { background: var(--pend-bg); color: var(--pend); } .icono.no { background: var(--no-bg); color: var(--no); }
  .act-cuerpo { flex: 1; min-width: 0; }
  .act-top { display: flex; align-items: flex-start; gap: 10px; }
  .act-nombre { flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere; line-height: 1.3; }
  .calif { flex: none; font-weight: 900; font-size: 1rem; color: var(--texto); background: var(--bg); border: 1.5px solid var(--borde); border-radius: 10px; padding: 2px 10px; white-space: nowrap; }
  .act-sub { font-size: .82rem; color: var(--suave); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .estado-txt.ok { color: var(--ok); font-weight: 800; } .estado-txt.pend { color: var(--pend); font-weight: 800; } .estado-txt.no { color: var(--no); font-weight: 800; }
  .nivel { border-radius: 999px; padding: 1px 9px; font-weight: 800; font-size: .75rem; border: 1.5px solid currentColor; }
  .nivel.apoyo { color: var(--no); } .nivel.proceso { color: var(--pend); } .nivel.esperado { color: var(--ok); } .nivel.otro { color: var(--suave); }

  /* OBSERVACIÓN del maestro dentro de cada actividad */
  .obs { margin-top: 10px; background: var(--obs-bg); border-left: 5px solid var(--obs-borde); border-radius: 0 12px 12px 0; padding: 10px 12px; scroll-margin-top: 80px; }
  .obs-eti { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--obs-eti); }
  .obs p { margin: 4px 0 0; font-size: .98rem; font-weight: 600; color: var(--texto); white-space: pre-line; overflow-wrap: anywhere; }
  .obs.destello { animation: destello 1.6s ease-out 1; }
  @keyframes destello { 0% { box-shadow: 0 0 0 6px rgba(26,158,154,.55); } 100% { box-shadow: 0 0 0 0 rgba(26,158,154,0); } }

  /* ---------- PESTAÑAS DE TRIMESTRE ---------- */
  .trim-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; margin-top: 12px; }
  .trim-tab { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; border-radius: 16px; text-align: left;
    font: inherit; font-weight: 800; font-size: .92rem; line-height: 1.15; }
  .trim-tab > span:first-child { font-size: 1.25rem; flex: none; }
  .trim-tab b { display: block; font-weight: 900; }
  .trim-tab small { display: block; font-weight: 700; font-size: .74rem; opacity: .9; margin-top: 2px; }
  .trim-tabs { margin: 0 0 12px; }
  .trim-tab { cursor: pointer; background: var(--card); color: var(--texto); border: 1.5px solid var(--borde); box-shadow: var(--sombra); }
  .trim-tab small { color: var(--suave); }
  .trim-tab[aria-selected="true"] { background: var(--petroleo); color: #fff; border-color: var(--petroleo); box-shadow: 0 4px 12px rgba(15,76,92,.25); }
  .trim-tab[aria-selected="true"] small { color: #bdf3ef; }
  .trim-uno { margin: 0 0 10px; font-weight: 900; color: var(--suave); }
  .btn-prom.en-panel { margin: 0 0 12px; padding-top: 12px; padding-bottom: 12px; }
  .btn-prom.en-panel .bp-trofeo { width: 46px; height: 46px; font-size: 1.6rem; }
  .trim-tab.actual { background: var(--petroleo); color: #fff; box-shadow: 0 4px 12px rgba(15,76,92,.25); }
  .trim-tab.actual small { color: #bdf3ef; }
  .trim-tab.pasado { cursor: pointer; background: var(--card); color: var(--texto); border: 1.5px solid #c9b6f2; }
  .trim-tab.pasado small { color: #6d28d9; }
  .trim-tab.pasado:hover, .trim-tab.pasado:focus-visible { border-color: #6d28d9; background: color-mix(in srgb, #6d28d9 8%, var(--card)); }
  :root[data-theme="dark"] .trim-tab.pasado small { color: #c4b5fd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .trim-tab.pasado small { color: #c4b5fd; } }

  /* ---------- PROMEDIO DEL TRIMESTRE ---------- */
  .btn-prom {
    position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 16px;
    border: 0; border-radius: 20px; padding: clamp(14px, 4vw, 18px) clamp(14px, 4vw, 20px); cursor: pointer; text-align: left; color: #fff;
    background: linear-gradient(120deg, #3b1f7a 0%, #6d28d9 45%, #c026d3 100%);
    box-shadow: 0 10px 28px rgba(109,40,217,.35), inset 0 0 0 2px rgba(255,214,102,.55);
    -webkit-tap-highlight-color: transparent; transition: transform .15s ease;
  }
  .btn-prom:active { transform: scale(.98); }
  .btn-prom::after { /* brillo que recorre el botón */
    content: ""; position: absolute; inset: -40% auto -40% -60%; width: 40%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent); animation: brillo 3.2s ease-in-out infinite;
  }
  @keyframes brillo { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .bp-trofeo { flex: none; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 2rem;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #ffc93c 55%, #e89b00); box-shadow: 0 0 0 4px rgba(255,201,60,.3); animation: flotar 2.6s ease-in-out infinite; }
  @keyframes flotar { 50% { transform: translateY(-3px) rotate(-4deg); } }
  .bp-txt { flex: 1; min-width: 0; }
  .bp-eti { display: block; font-size: .72rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #ffd966; }
  .bp-tit { display: block; font-size: clamp(1.05rem, 4.2vw, 1.25rem); font-weight: 900; line-height: 1.2; }
  .bp-sub { display: block; font-size: .85rem; opacity: .9; margin-top: 2px; }
  .bp-ir { flex: none; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 1.3rem; font-weight: 900; }

  dialog.prom { width: min(560px, 100vw); max-width: 100vw; max-height: 100dvh; padding: 0; border: 0; border-radius: 24px; background: var(--card); color: var(--texto); box-shadow: 0 30px 80px rgba(0,0,0,.4); overflow: hidden; }
  dialog.prom::backdrop { background: rgba(10,20,30,.62); backdrop-filter: blur(3px); }
  dialog.prom[open] { animation: subir .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes subir { from { transform: translateY(40px) scale(.96); opacity: 0; } }
  @media (max-width: 600px) {
    dialog.prom { width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; }
  }
  .pr-scroll { max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 601px) { .pr-scroll { max-height: min(88dvh, 860px); } }
  .pr-cab { position: relative; color: #fff; text-align: center; padding: calc(18px + env(safe-area-inset-top)) 20px 64px;
    background: radial-gradient(circle at 20% 0%, rgba(255,255,255,.18), transparent 45%), linear-gradient(140deg, #3b1f7a, #6d28d9 55%, #c026d3); }
  .pr-cerrar { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.18); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; }
  .pr-eti { margin: 0 44px; font-size: .75rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #ffd966; }
  .pr-nombre { margin: 4px 44px 0; font-size: clamp(1.25rem, 5vw, 1.55rem); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
  .pr-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pr-tab { border: 0; border-radius: 999px; padding: 0 14px; min-height: 36px; font-weight: 800; font-size: .85rem; cursor: pointer; background: rgba(255,255,255,.16); color: #fff; }
  .pr-tab[aria-selected="true"] { background: #ffd966; color: #3b1f7a; }

  .pr-anillo { position: relative; width: 190px; height: 190px; margin: -52px auto 0; border-radius: 50%; background: var(--card); box-shadow: 0 12px 30px rgba(59,31,122,.25); display: grid; place-items: center; }
  .pr-anillo svg { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); transform: rotate(-90deg); }
  .pr-anillo .pista { fill: none; stroke: var(--bg); stroke-width: 14; }
  .pr-anillo .valor { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
  .pr-centro { position: relative; text-align: center; }
  .pr-num { display: block; font-size: 3.4rem; font-weight: 900; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .pr-de { display: block; font-size: .8rem; font-weight: 800; color: var(--suave); margin-top: 2px; }
  .pr-sello { display: block; width: fit-content; margin: 14px auto 0; padding: 6px 16px; border-radius: 999px; font-weight: 900; font-size: 1.02rem; }
  .pr-frase { text-align: center; margin: 8px auto 0; max-width: 34ch; padding: 0 20px; color: var(--suave); font-weight: 600; }
  .tono-ok   { --tono: #16a34a; } .tono-mid { --tono: #d97706; } .tono-low { --tono: #dc2626; } .tono-top { --tono: #7c3aed; }
  .pr-sello { background: color-mix(in srgb, var(--tono) 14%, transparent); color: var(--tono); }
  .pr-num { color: var(--tono); }

  .pr-cuerpo { padding: 8px clamp(16px, 5vw, 24px) calc(24px + env(safe-area-inset-bottom)); }
  .pr-disc { margin-top: 18px; border: 1px solid var(--borde); border-radius: 18px; padding: 14px 16px; background: var(--card); }
  .pr-disc-cab { display: flex; align-items: center; gap: 10px; }
  .pr-disc-cab b { flex: 1; min-width: 0; font-size: 1.02rem; }
  .pr-pill { flex: none; font-weight: 900; font-size: 1.05rem; color: #fff; background: var(--tono); border-radius: 12px; padding: 2px 12px; }
  .pr-rubro { margin-top: 12px; }
  .pr-rubro-top { display: flex; align-items: baseline; gap: 8px; font-size: .9rem; }
  .pr-rubro-top span { flex: 1; min-width: 0; font-weight: 700; }
  .pr-rubro-top small { color: var(--suave); font-weight: 700; }
  .pr-rubro-top b { font-variant-numeric: tabular-nums; color: var(--tono); }
  .pr-barra { height: 10px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-top: 5px; }
  .pr-barra i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--tono) 70%, #fff), var(--tono)); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .pr-nota { margin: 18px 0 0; font-size: .82rem; color: var(--suave); text-align: center; }
  canvas.confeti { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 2147483647; }
  @media (prefers-reduced-motion: reduce) {
    .btn-prom::after, .bp-trofeo { animation: none; }
    dialog.prom[open] { animation: none; }
    .pr-anillo .valor, .pr-barra i { transition: none; }
  }

  .demo { background: var(--ambar); color: #3a2600; text-align: center; font-weight: 800; font-size: .8rem; padding: 6px 12px; }
  .pie { color: var(--suave); font-size: .78rem; text-align: center; margin-top: 30px; grid-column: 1 / -1; }

  /* Pantallas muy angostas (≤ 340 px): números del resumen más compactos */
  @media (max-width: 420px) { .cuenta-txt { display: none; } }
  @media (max-width: 340px) {
    .cifra { padding: 10px 2px; }
    .msj-ico { width: 40px; height: 40px; font-size: 1.2rem; }

  /* Celular acostado: aprovecha el ancho */
  @media (orientation: landscape) and (max-height: 500px) {

  @media print {

    details.semana:not([open]) .act-lista { display: block; }
    body { background: #fff; }

</style>

<script>
/* =====================================================================
   1) Pega aquí la URL de tu Apps Script (la que termina en /exec).
      Mientras esté vacía, la página funciona en MODO DE PRUEBA.
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz_G4QxXSxUk5te4CnjoqtNezfYgtZwApxCLxXF1c5HRh_wA1VCxiJDPebohdj5ymHuSQ/exec';

const LLAVE = 'mb_familias_codigo';
const params = new URLSearchParams(location.search);
const DEMO = !API_URL || params.has('demo');
const $ = s => document.querySelector(s);

/* ---------- Utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sinAcentos = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const normCodigo = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtCodigo = s => { const n = normCodigo(s).slice(0, 8); return n.length > 4 ? n.slice(0, 4) + '-' + n.slice(4) : n; };

function aFecha(iso) {
  if (!iso) return null;
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  return y ? new Date(y, m - 1, d) : null;
}
function isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function lunesDe(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const fDia = new Intl.DateTimeFormat('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
const fCorta = new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long' });
const fHora = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });

function etiquetaSemana(lunes) {
  const hoy = lunesDe(new Date()).getTime();
  const dif = Math.round((hoy - lunes.getTime()) / (7 * 864e5));
  const viernes = new Date(lunes.getTime() + 4 * 864e5);
  const rango = lunes.getMonth() === viernes.getMonth()
    ? lunes.getDate() + ' al ' + fCorta.format(viernes)
    : fCorta.format(lunes) + ' al ' + fCorta.format(viernes);
  if (dif === 0) return 'Esta semana · ' + rango;
  if (dif === 1) return 'Semana pasada · ' + rango;
  return 'Semana del ' + rango;
}

function estadoDe(s) {
  const t = sinAcentos(s).trim();
  if (/^no|no.?entreg|sin.?entreg|falt/.test(t)) return 'no';
  if (/entreg|complet|hecho|^si$|^ok$/.test(t)) return 'ok';
  return 'pend';
}
const ESTADO = { ok: ['✓', 'Entregó'], pend: ['•', 'Pendiente'], no: ['✕', 'No entregó'] };

function nivelDe(s) {
  const t = sinAcentos(s);
  if (!t.trim()) return null;
  if (/apoyo/.test(t)) return ['apoyo', 'Requiere apoyo'];
  if (/proceso/.test(t)) return ['proceso', 'En proceso'];
  if (/esperado|logrado|destacado/.test(t)) return ['esperado', 'Nivel esperado'];
  return ['otro', String(s)];
}

function guardar(c) { try { localStorage.setItem(LLAVE, c); } catch (e) {} }
function recuperar() { try { return localStorage.getItem(LLAVE) || ''; } catch (e) { return ''; } }
function olvidar() { try { localStorage.removeItem(LLAVE); } catch (e) {} }

/* ---------- Datos ---------- */
async function consultar(codigo) {
  if (DEMO) return datosDemo(codigo);
  const r = await fetch(API_URL + '?codigo=' + encodeURIComponent(codigo), { method: 'GET', cache: 'no-store' });
  if (!r.ok) throw new Error('red');
  return r.json();
}

function datosDemo(codigo) {
  const lunes = lunesDe(new Date());
  const dia = k => isoLocal(new Date(lunes.getTime() + k * 864e5));
  return new Promise(res => setTimeout(() => res({
    ok: true,
    alumno: { nombre: 'Ana P.', grupo: '2A' },
    actualizado: isoLocal(new Date()) + 'T18:30',
    promedios: [
      { periodo: '1', titulo: 'Primer Trimestre', disciplina: 'Tecnología', promedio: 8.7, verde: 8, amarillo: 6,
        rubros: [{ n: 'Tareas', w: 30, v: 9.2 }, { n: 'Proyecto', w: 40, v: 8.5 }, { n: 'Examen', w: 30, v: 8.4 }] },
      { periodo: '1', titulo: 'Primer Trimestre', disciplina: 'Integración Curricular', promedio: 9.1, verde: 8, amarillo: 6,
        rubros: [{ n: 'Participación', w: 40, v: 9.5 }, { n: 'Trabajos', w: 60, v: 8.8 }] },
    ],
    nota: { texto: 'Muy buena participación en su equipo esta semana. Le falta entregar el guion final.', fecha: dia(3) },
    anuncios: [
      { fecha: dia(0), tipo: 'Material', titulo: 'Audífonos para el podcast', texto: 'A partir del miércoles traer audífonos con cable para editar en Audacity.' },
      { fecha: dia(0), tipo: 'Tarea', titulo: 'Guion final del podcast', texto: 'Entregar el guion impreso el jueves. Mínimo una cuartilla, con nombres del equipo.' },
      { fecha: dia(-2), tipo: 'Evento', titulo: 'Festival de noviembre', texto: 'Los mejores podcasts se presentarán en el festival. Están invitados.' },
    ],
    actividades: [
      { fecha: dia(3), actividad: 'Guion del podcast (final)', tipo: 'Proyecto', estado: 'pendiente', nivel: '', periodo: '2', trimestre: 'Segundo Trimestre' },
      { fecha: dia(2), actividad: 'Edición: cortar silencios y ruido', tipo: 'Práctica', estado: 'entregado', calificacion: '7 / 10', nivel: 'En proceso', comentario: 'Le costó usar la herramienta de reducción de ruido.', periodo: '2', trimestre: 'Segundo Trimestre' },
      { fecha: dia(0), actividad: 'Guion del podcast (borrador)', tipo: 'Proyecto', estado: 'entregado', calificacion: '9 / 10', nivel: 'Nivel esperado', periodo: '2', trimestre: 'Segundo Trimestre' },
      { fecha: dia(-3), actividad: 'Práctica 4: grabar voces en Audacity', tipo: 'Práctica', estado: 'entregado', nivel: 'Nivel esperado', periodo: '2', trimestre: 'Segundo Trimestre' },
      { fecha: dia(-5), actividad: 'Mapa mental: historia de Xalisco', tipo: 'Clase', estado: 'no_entregado', nivel: '', comentario: 'No lo entregó en clase. Puede traerlo el lunes para revisión.', periodo: '2', trimestre: 'Segundo Trimestre' },
      { fecha: dia(-17), actividad: 'Examen del primer trimestre', tipo: 'Examen', estado: 'entregado', calificacion: '8.4 / 10', nivel: 'Nivel esperado', periodo: '1', trimestre: 'Primer Trimestre' },
      { fecha: dia(-19), actividad: 'Proyecto: mi primera grabación', tipo: 'Proyecto', estado: 'entregado', calificacion: '8.5 / 10', nivel: 'Nivel esperado', periodo: '1', trimestre: 'Primer Trimestre' },
      { fecha: dia(-24), actividad: 'Investigación: origen del Día de Muertos', tipo: 'Tarea', estado: 'entregado', calificacion: '9 / 10', nivel: 'Nivel esperado', periodo: '1', trimestre: 'Primer Trimestre' },
      { fecha: dia(-26), actividad: 'Cuestionario: partes de la computadora', tipo: 'Tarea', estado: 'entregado', calificacion: '9.5 / 10', nivel: 'Nivel esperado', periodo: '1', trimestre: 'Primer Trimestre' },
    ],
  }), 350));
}

/* ---------- Pantallas ---------- */
function mostrarAcceso(msg) {
  $('#panel').hidden = true;
  $('#acceso').hidden = false;
  const e = $('#error');
  e.hidden = !msg; e.textContent = msg || '';
}

const MAESTRO = 'Prof. Nicolás Contreras Medina';
const ICONO_ANUNCIO = { tarea: '📝', material: '🎒', evento: '🎉', reunion: '👥', aviso: '📢' };
const esReciente = (f, dias) => f && (Date.now() - f.getTime()) / 864e5 <= dias;

function render(d) {
  const acts = (d.actividades || []).map((a, i) => ({ ...a, i, f: aFecha(a.fecha), e: estadoDe(a.estado) }));

  // Agrupa por semana (de lunes a domingo)
  const semanas = new Map();
  acts.forEach(a => {
    const k = a.f ? isoLocal(lunesDe(a.f)) : 'sin-fecha';
    if (!semanas.has(k)) semanas.set(k, []);
    semanas.get(k).push(a);
  });
  const claves = [...semanas.keys()].sort().reverse();
  const reciente = claves.length ? semanas.get(claves[0]) : [];
  const cuenta = t => reciente.filter(a => a.e === t).length;
  const tituloResumen = claves.length && claves[0] !== 'sin-fecha' ? etiquetaSemana(aFecha(claves[0])) : 'Actividades';

  let act = '';
  if (d.actualizado) {
    const [f, h] = String(d.actualizado).split('T');
    const fecha = aFecha(f);
    if (fecha && h) { const [hh, mm] = h.split(':').map(Number); fecha.setHours(hh || 0, mm || 0); }
    if (fecha) act = 'Actualizado el ' + fHora.format(fecha);
  }

  const A = [], B = [];

  A.push(`
    <section class="alumno">
      <h2>${esc(d.alumno.nombre)}</h2>
      <span class="grupo">Grupo ${esc(d.alumno.grupo)}</span>
      ${act ? `<p class="act">${esc(act)}</p>` : ''}
    </section>`);

  // 0) Trimestres: actividades agrupadas por trimestre y promedios publicados por el maestro
  PROMS = Array.isArray(d.promedios) ? d.promedios.filter(p => isFinite(Number(p.promedio))) : [];
  ALUMNO = d.alumno;
  const NOMBRE_T = { 1: 'Primer', 2: 'Segundo', 3: 'Tercer' };
  const nombreTrim = t => {
    const a = acts.find(x => String(x.periodo) === t && x.trimestre), p = PROMS.find(x => x.periodo === t);
    return (a && a.trimestre) || (p && p.titulo) || (NOMBRE_T[t] ? NOMBRE_T[t] + ' Trimestre' : 'Actividades');
  };
  const trimsActs = [...new Set(acts.map(a => String(a.periodo || '')))];
  const hayTrims = trimsActs.some(t => t);
  const TRIMS = hayTrims ? [...new Set([...trimsActs.filter(Boolean), ...PROMS.map(p => p.periodo)])].sort() : [''];
  const actualT = TRIMS[TRIMS.length - 1];
  const promsT = [...new Set(PROMS.map(p => p.periodo))].sort();
  const botonProm = (t, extra) => {
    const titulo = nombreTrim(t);
    return `
      <button class="btn-prom ${extra || ''}" type="button" data-t="${esc(t)}" aria-haspopup="dialog">
        <span class="bp-trofeo" aria-hidden="true">🏆</span>
        <span class="bp-txt">
          <span class="bp-eti">¡Ya está disponible!</span>
          <span class="bp-tit">Promedio del ${esc(titulo)}</span>
          <span class="bp-sub">Toque aquí para ver el resultado de ${esc(String(d.alumno.nombre).split(' ')[0])}</span>
        </span>
        <span class="bp-ir" aria-hidden="true">›</span>
      </button>`;
  };
  // Anuncio del promedio en la pantalla principal (el trimestre publicado más reciente)
  if (promsT.length) A.push(botonProm(promsT[promsT.length - 1]));

  // 1) Mensaje del maestro: lo primero que se ve
  if (d.nota && d.nota.texto) {
    const f = aFecha(d.nota.fecha);
    A.push(`
      <section class="mensaje" role="note" aria-label="Mensaje del maestro">
        <div class="msj-cab">
          <span class="msj-ico" aria-hidden="true">✉️</span>
          <div class="msj-quien"><span class="msj-eti">Mensaje del maestro</span><small>${esc(MAESTRO)}</small>${f ? `<small>${esc(fDia.format(f))}</small>` : ''}</div>
        </div>
        ${esReciente(f, 7) ? '<span class="nuevo">Nuevo</span>' : ''}
        <p class="msj-txt">${esc(d.nota.texto)}</p>
      </section>`);
  }

  // 2) Aviso de observaciones en actividades (del trimestre actual)
  const conObs = acts.filter(a => String(a.periodo || '') === actualT && String(a.comentario || '').trim());
  if (conObs.length) {
    const n = conObs.length;
    A.push(`
      <button class="aviso-obs" type="button" id="ir-obs">
        <span class="n" aria-hidden="true">${n}</span>
        <span>El maestro dejó <b>${n === 1 ? 'una observación' : n + ' observaciones'}</b> en ${n === 1 ? 'una actividad' : 'las actividades'}.</span>
        <span class="ir">Ver ↓</span>
      </button>`);
  }

  // 3) Resumen
  if (reciente.length) {
    A.push(`
      <p class="resumen-titulo">${esc(tituloResumen)}</p>
      <section class="resumen" aria-label="Resumen de la semana">
        <div class="cifra ok"><b>${cuenta('ok')}</b><span>Entregadas</span></div>
        <div class="cifra pend"><b>${cuenta('pend')}</b><span>Pendientes</span></div>
        <div class="cifra no"><b>${cuenta('no')}</b><span>Sin entregar</span></div>
      </section>`);
  }

  // 4) Anuncios
  A.push('<h3>📢 Anuncios</h3>');
  if ((d.anuncios || []).length) {
    d.anuncios.forEach(a => {
      const tipo = sinAcentos(a.tipo);
      const clave = /tarea/.test(tipo) ? 'tarea' : /evento/.test(tipo) ? 'evento' : /reunion/.test(tipo) ? 'reunion' : /material/.test(tipo) ? 'material' : 'aviso';
      const f = aFecha(a.fecha);
      A.push(`
        <article class="anuncio ${clave}">
          <span class="an-ico" aria-hidden="true">${ICONO_ANUNCIO[clave]}</span>
          <div class="an-cuerpo">
            <div class="meta"><span class="chip">${esc(a.tipo || 'Aviso')}${esReciente(f, 3) ? '<span class="nuevo">Nuevo</span>' : ''}</span><span>${f ? esc(fDia.format(f)) : ''}</span></div>
            <h4>${esc(a.titulo)}</h4>
            ${a.texto ? `<p>${esc(a.texto)}</p>` : ''}
          </div>
        </article>`);
    });
  } else {
    A.push('<div class="vacio">No hay anuncios por ahora.</div>');
  }

  // 5) Actividades por trimestre (pestañas) y, dentro, por semana
  const semanasDe = lista => {
    const m = new Map();
    lista.forEach(a => { const k = a.f ? isoLocal(lunesDe(a.f)) : 'sin-fecha'; if (!m.has(k)) m.set(k, []); m.get(k).push(a); });
    return m;
  };
  const htmlSemanas = lista => {
    const m = semanasDe(lista), ks = [...m.keys()].sort().reverse();
    if (!ks.length) return '<div class="vacio">Aún no hay actividades publicadas en este trimestre.</div>';
    return ks.map((k, i) => {
      const sem = m.get(k).sort((x, y) => (y.f || 0) - (x.f || 0));
      const ent = sem.filter(a => a.e === 'ok').length;
      const obsSemana = sem.some(a => String(a.comentario || '').trim());
      const titulo = k === 'sin-fecha' ? 'Sin fecha' : etiquetaSemana(aFecha(k));
      return `
        <details class="semana" ${i === 0 || obsSemana ? 'open' : ''}>
          <summary><span class="tit">${esc(titulo)}</span>${obsSemana ? '<span class="tiene-obs" title="Tiene observaciones">💬</span>' : ''}<span class="cuenta">${ent}/${sem.length}<span class="cuenta-txt"> entregadas</span></span></summary>
          <ul class="act-lista">
            ${sem.map(a => {
              const [ic, txt] = ESTADO[a.e];
              const nv = nivelDe(a.nivel);
              const obs = String(a.comentario || '').trim();
              return `
              <li class="act-item">
                <span class="icono ${a.e}" aria-hidden="true">${ic}</span>
                <div class="act-cuerpo">
                  <div class="act-top">
                    <div class="act-nombre">${esc(a.actividad)}</div>
                    ${a.calificacion ? `<span class="calif" title="Calificación">${esc(a.calificacion)}</span>` : ''}
                  </div>
                  <div class="act-sub">
                    <span class="estado-txt ${a.e}">${txt}</span>
                    ${a.f ? `<span>${esc(fDia.format(a.f))}</span>` : ''}
                    ${a.tipo ? `<span>${esc(a.tipo)}</span>` : ''}
                    ${nv ? `<span class="nivel ${nv[0]}">${esc(nv[1])}</span>` : ''}
                  </div>
                  ${obs ? `<div class="obs" id="obs-${a.i}"><span class="obs-eti">💬 Observación del maestro</span><p>${esc(obs)}</p></div>` : ''}
                </div>
              </li>`;
            }).join('')}
          </ul>
        </details>`;
    }).join('');
  };

  B.push('<h3>📚 Actividades</h3>');
  if (!acts.length && !promsT.length) {
    B.push('<div class="vacio">Aún no hay actividades publicadas.</div>');
  } else if (!hayTrims) {
    B.push(htmlSemanas(acts));
  } else {
    if (TRIMS.length > 1) {
      B.push(`<div class="trim-tabs" role="tablist" aria-label="Trimestres">${TRIMS.slice().reverse().map(t => {
        const n = acts.filter(a => String(a.periodo) === t).length, conProm = promsT.includes(t);
        const sub = t === actualT && !conProm ? 'En curso' : n + (n === 1 ? ' actividad' : ' actividades');
        return `<button class="trim-tab" role="tab" type="button" id="tab-t${esc(t)}" aria-controls="panel-t${esc(t)}" aria-selected="${t === actualT}" data-t="${esc(t)}">
          <span aria-hidden="true">${conProm ? '🏆' : '📚'}</span><span><b>${esc(nombreTrim(t))}</b><small>${sub}</small></span></button>`;
      }).join('')}</div>`);
    }
    TRIMS.forEach(t => {
      const lista = acts.filter(a => String(a.periodo) === t);
      B.push(`<section class="trim-panel" role="tabpanel" id="panel-t${esc(t)}" aria-labelledby="tab-t${esc(t)}" ${t === actualT ? '' : 'hidden'}>
        ${TRIMS.length === 1 ? `<p class="trim-uno">📚 ${esc(nombreTrim(t))}</p>` : ''}
        ${promsT.includes(t) ? botonProm(t, 'en-panel') : ''}
        ${htmlSemanas(lista)}
      </section>`);
    });
  }

  $('#contenido').innerHTML = `
    <div class="tablero">
      <div class="col col-a">${A.join('')}</div>
      <div class="col col-b">${B.join('')}</div>
      <p class="pie">Si tiene dudas, comuníquese directamente con el maestro.<br>Información confidencial para la familia del alumno.</p>
    </div>`;

  document.querySelectorAll('.btn-prom').forEach(b => b.addEventListener('click', () => abrirPromedio(b.dataset.t)));
  document.querySelectorAll('.trim-tab').forEach(b => b.addEventListener('click', () => mostrarTrim(b.dataset.t)));

  const ir = $('#ir-obs');
  if (ir) ir.addEventListener('click', () => {
    mostrarTrim(actualT);
    const o = document.querySelector('.trim-panel:not([hidden]) .obs') || document.querySelector('.obs');
    if (!o) return;
    const det = o.closest('details'); if (det) det.open = true;
    o.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    o.classList.remove('destello'); void o.offsetWidth; o.classList.add('destello');
  });

  $('#acceso').hidden = true;
  $('#panel').hidden = false;
  window.scrollTo(0, 0);
}

function mostrarTrim(t) {
  document.querySelectorAll('.trim-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  document.querySelectorAll('.trim-panel').forEach(p => { p.hidden = p.id !== 'panel-t' + t; });
}

/* ================= Promedio del trimestre ================= */
let PROMS = [], ALUMNO = null, TRIM_ACTUAL = null;
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('es-MX', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function tonoDe(v, verde, amarillo) {
  if (v >= 9.5) return 'tono-top';
  if (v >= verde) return 'tono-ok';
  if (v >= amarillo) return 'tono-mid';
  return 'tono-low';
}
const SELLO = {
  'tono-top': ['¡Excelente! 🌟', '¡Un trabajo sobresaliente! Felicidades por el esfuerzo.'],
  'tono-ok':  ['¡Muy bien! 👏', 'Va por muy buen camino. ¡A seguir así!'],
  'tono-mid': ['En proceso 💪', 'Puede mejorar. Revisemos juntos las actividades pendientes.'],
  'tono-low': ['Requiere apoyo 🤝', 'Necesita reforzar. Le invito a platicar con el maestro para apoyarle.'],
};
const reduceMov = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function abrirPromedio(trim) {
  const trims = [...new Set(PROMS.map(p => p.periodo))].sort();
  TRIM_ACTUAL = trim || TRIM_ACTUAL || trims[trims.length - 1];
  const filas = PROMS.filter(p => p.periodo === TRIM_ACTUAL);
  if (!filas.length) return;
  const verde = Number(filas[0].verde) || 8, amarillo = Number(filas[0].amarillo) || 6;
  const general = filas.reduce((s, p) => s + Number(p.promedio), 0) / filas.length;
  const tono = tonoDe(general, verde, amarillo);
  const [sello, frase] = SELLO[tono];
  const R = 70, C = 2 * Math.PI * R;

  let dlg = $('#dlg-prom');
  if (!dlg) {
    dlg = document.createElement('dialog');
    dlg.id = 'dlg-prom'; dlg.className = 'prom'; dlg.setAttribute('aria-labelledby', 'pr-titulo');
    document.body.appendChild(dlg);
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });   // tocar fuera cierra
    dlg.addEventListener('close', () => { document.body.style.overflow = ''; });
  }
  dlg.innerHTML = `
    <div class="pr-scroll">
      <header class="pr-cab">
        <button class="pr-cerrar" type="button" aria-label="Cerrar">×</button>
        <div class="pr-eti" id="pr-titulo">🏆 Promedio · ${esc(filas[0].titulo)}</div>
        <div class="pr-nombre">${esc(ALUMNO ? ALUMNO.nombre : '')}</div>
        ${trims.length > 1 ? `<div class="pr-tabs" role="tablist">${trims.map(t => {
          const tt = PROMS.find(p => p.periodo === t);
          return `<button class="pr-tab" role="tab" type="button" data-t="${esc(t)}" aria-selected="${t === TRIM_ACTUAL}">${esc(tt.titulo)}</button>`;
        }).join('')}</div>` : ''}
      </header>
      <div class="${tono}">
        <div class="pr-anillo" role="img" aria-label="Promedio ${fmt1(general)} de 10">
          <svg viewBox="0 0 160 160" aria-hidden="true">
            <circle class="pista" cx="80" cy="80" r="${R}"/>
            <circle class="valor" cx="80" cy="80" r="${R}" stroke="var(--tono)" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
          </svg>
          <div class="pr-centro"><span class="pr-num" data-v="${general}">0.0</span><span class="pr-de">${filas.length > 1 ? 'promedio general' : 'de 10'}</span></div>
        </div>
        <span class="pr-sello">${sello}</span>
        <p class="pr-frase">${frase}</p>
      </div>
      <div class="pr-cuerpo">
        ${filas.map(p => {
          const tp = tonoDe(Number(p.promedio), verde, amarillo);
          const rubros = Array.isArray(p.rubros) ? p.rubros : [];
          return `
          <section class="pr-disc ${tp}">
            <div class="pr-disc-cab"><b>${esc(p.disciplina || 'Promedio')}</b><span class="pr-pill">${fmt1(Number(p.promedio))}</span></div>
            ${rubros.map(r => {
              const tr = tonoDe(Number(r.v), verde, amarillo);
              return `<div class="pr-rubro ${tr}">
                <div class="pr-rubro-top"><span>${esc(r.n)}</span>${r.w ? `<small>${esc(String(r.w))} %</small>` : ''}<b>${fmt1(Number(r.v))}</b></div>
                <div class="pr-barra"><i data-w="${Math.max(0, Math.min(100, Number(r.v) * 10))}"></i></div>
              </div>`;
            }).join('')}
          </section>`;
        }).join('')}
        <p class="pr-nota">Promedio calculado por el maestro con los rubros del trimestre.<br>Si tiene dudas, comuníquese directamente con él.</p>
      </div>
    </div>`;

  dlg.querySelector('.pr-cerrar').addEventListener('click', () => dlg.close());
  dlg.querySelectorAll('.pr-tab').forEach(b => b.addEventListener('click', () => abrirPromedio(b.dataset.t)));
  if (!dlg.open) { dlg.showModal(); document.body.style.overflow = 'hidden'; }
  dlg.querySelector('.pr-scroll').scrollTop = 0;

  // Animaciones: anillo, número que sube, barras y confeti
  const anillo = dlg.querySelector('.valor'), num = dlg.querySelector('.pr-num');
  const meta = Math.max(0, Math.min(10, general));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    anillo.style.strokeDashoffset = String(C * (1 - meta / 10));
    dlg.querySelectorAll('.pr-barra i').forEach((b, i) => setTimeout(() => { b.style.width = b.dataset.w + '%'; }, reduceMov() ? 0 : 250 + i * 90));
  }));
  if (reduceMov()) { num.textContent = fmt1(general); }
  else {
    const t0 = performance.now(), dur = 1400;
    const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); num.textContent = fmt1(general * e); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  }
  if (general >= verde && !reduceMov()) setTimeout(() => confeti(general >= 9.5 ? 170 : 110), 900);
}

function confeti(n) {
  const cv = document.createElement('canvas'); cv.className = 'confeti';
  const dlg = $('#dlg-prom'); (dlg && dlg.open ? dlg : document.body).appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const colores = ['#ffc93c', '#6d28d9', '#c026d3', '#16a34a', '#1a9e9a', '#f97316', '#ffffff'];
  const ps = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .32, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colores[(Math.random() * colores.length) | 0],
  }));
  const t0 = performance.now();
  (function cuadro(t) {
    const dt = t - t0; ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .32; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - dt / 3200); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (dt < 3200) requestAnimationFrame(cuadro); else cv.remove();
  })(t0);
}

async function entrar(codigo) {
  const c = fmtCodigo(codigo);
  if (normCodigo(c).length !== 8) { mostrarAcceso('El código tiene 8 letras y números, por ejemplo K7PQ-29XM.'); return; }
  const btn = $('#btn-entrar');
  btn.disabled = true; btn.textContent = 'Consultando…';
  $('#error').hidden = true;
  try {
    const d = await consultar(c);
    if (!d || !d.ok) { olvidar(); mostrarAcceso((d && d.error) || 'Código no válido.'); return; }
    if ($('#recordar').checked) guardar(c); else olvidar();
    render(d);
  } catch (e) {
    mostrarAcceso('No se pudo conectar. Revise su internet e intente de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

/* ---------- Eventos ---------- */
$('#codigo').addEventListener('input', e => {
  const v = fmtCodigo(e.target.value);
  if (v !== e.target.value) e.target.value = v;
});
$('#form-acceso').addEventListener('submit', e => { e.preventDefault(); entrar($('#codigo').value); });
$('#btn-salir').addEventListener('click', () => { olvidar(); $('#codigo').value = ''; mostrarAcceso(''); });

/* ---------- Inicio ---------- */
if (DEMO) $('#aviso-demo').hidden = false;
(function inicio() {
  // El QR trae ?c=CODIGO; se quita de la barra para que no quede en el historial
  const delQR = params.get('c');
  if (delQR) {
    params.delete('c');
    const resto = params.toString();
    history.replaceState(null, '', location.pathname + (resto ? '?' + resto : ''));
  }
  const c = delQR || recuperar();
  if (c) { $('#codigo').value = fmtCodigo(c); entrar(c); }
})();
</script>

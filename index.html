.att-card.st-F,.att-card.st-FI{border-color:#f0b4bd;background:#FFECEF}.att-card.st-FJ{border-color:#efd18b;background:#FFF6DD}
.att-toggle{border:0;background:transparent;text-align:left;font-size:17px;font-weight:800;color:#203047;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px}
.att-toggle .st{font-size:14px;font-weight:700}
.att-sub{display:flex;gap:6px;flex-wrap:wrap}
.att-btn{border:1px solid #d6e0e8;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
.att-btn.on{background:#203047;color:#fff}
.save-bar{position:sticky;bottom:0;background:#ffffffee;padding:12px;border-top:1px solid #e3eaf1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.done-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:#E1F5EC;color:#14543F;margin:12px 0}
.empty-state{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
/* Importar */
.dropzone{border:3px dashed #9db6c6;border-radius:18px;background:#F6FAFC;padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;font-size:16px}
.dropzone.over,.dropzone:hover,.dropzone:focus-visible{border-color:var(--accent);background:#fff}
.dz-ico{font-size:38px}
.imp-table input.field{min-width:220px}
.imp-flag{font-size:13px;font-weight:700;color:#7A4B00;background:#FFF0D2;border-radius:8px;padding:3px 8px}
/* Ventanas */
.modal-back{position:fixed;inset:0;background:#10202d99;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:26px}
.modal-card.wide{max-width:860px}
.help-ico{font-size:46px;text-align:center}.modal-card h2{text-align:center;margin:6px 0 14px}
.help-steps{font-size:17px;line-height:1.7;padding-left:24px}
/* Avisos */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(560px,94vw)}
.toast{display:flex;align-items:center;gap:10px;background:#203047;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px #0004;font-size:16px}
.toast.success{background:#14654F}.toast.error{background:#A83242}
.toast-msg{flex:1;white-space:pre-line}.toast-ic{font-weight:900}
.toast-undo{background:#fff;color:#203047;border:0;border-radius:10px;padding:8px 12px;font-weight:800}
.toast-x{background:transparent;border:0;color:#fff;font-size:22px;line-height:1}
/* Asistente */
.wizard{max-width:720px;margin:0 auto}
.wiz-head{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.wiz-dots{display:flex;align-items:center;gap:6px}
.wiz-dot{width:36px;height:36px;border-radius:50%;background:#e3eaf1;color:#4A5B6D;display:grid;place-items:center;font-weight:800}
.wiz-dot.on{background:var(--accent);color:#fff}.wiz-dot.done{background:#14654F;color:#fff}
.wiz-line{width:28px;height:3px;background:#e3eaf1}
.wiz-actions{display:flex;justify-content:space-between;margin-top:20px}.wiz-skip{text-align:center;margin-top:12px}
.ok-hint{border-left-color:#14654F;background:#E1F5EC;color:#14543F}
/* Cuadrícula */
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.lg{padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.g-ok{background:#D5F0E0;color:#0F5A3A}.g-mid{background:#FFF0B8;color:#6B5200}.g-low{background:#FFD3D8;color:#8E1F30}
.grid-wrap{max-height:70vh}
.gradegrid th.gh{min-width:130px;text-transform:none;font-size:13px;vertical-align:top}
.gradegrid .gh-name{font-weight:800;font-size:14px;color:#203047;white-space:normal}
.gh-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.gradegrid .stickycol{position:sticky;left:0;background:#fff;z-index:2;min-width:160px}
.gradegrid thead th{position:sticky;top:0;background:#f4f7fa;z-index:3}
.gcell{width:84px;min-width:0;text-align:center;font-weight:700;font-size:17px}
input.gcell.g-ok{background:#D5F0E0}input.gcell.g-mid{background:#FFF0B8}input.gcell.g-low{background:#FFD3D8}
.avgpill{padding:5px 12px;border-radius:999px;font-weight:800}
.quick-add{margin-top:16px}.quick-add summary{font-weight:800;cursor:pointer;padding:6px 0}
.activity-create{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:10px}
.activity-create label{display:block}
/* Letra grande */
.big-text .main,.big-text .side{zoom:1.18}
@media(max-width:700px){.more-menu{right:auto;left:0}}
@media print{.topbar,#toasts,.subtabs{display:none!important}}
.chip{font-size:14px}.side .brand small{font-size:12px}
.mini{font-size:14px}.rows th{font-size:13px}

.quote{margin:0 0 16px;padding:14px 20px;border-left:5px solid var(--accent);background:#ffffffcc;border-radius:0 14px 14px 0}
.quote blockquote{margin:0;font-size:19px;line-height:1.45;font-style:italic;color:#203047}
.quote figcaption{margin-top:8px;font-size:15px;color:#4A5B6D}.quote cite{font-style:normal}

/* Iconos */
.svgi{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.28em;flex:none}
.ic{display:inline-block}.side .nav .svgi{width:1.35em;height:1.35em}
body.secondary-edition .side .nav .svgi{color:#2F5FA7}body.secondary-edition .side .nav.on .svgi{color:#1E3F78}
body.secondary-edition .more-menu .svgi{color:#2F5FA7}
body.secondary-edition .subtab .svgi{color:#2F5FA7}body.secondary-edition .subtab.on .svgi{color:#fff}
body.secondary-edition .home-card .hc-ico{display:grid;place-items:center;width:68px;height:68px;border-radius:20px;background:#E5ECF7;color:#1E3F78;box-shadow:inset 0 -3px 0 #D8A45A}
body.secondary-edition .home-card .hc-ico .svgi{width:34px;height:34px;stroke-width:1.6}
body.secondary-edition .help-ico{display:grid;place-items:center;width:80px;height:80px;margin:0 auto;border-radius:24px;background:#E5ECF7;color:#1E3F78;box-shadow:inset 0 -3px 0 #D8A45A}
body.secondary-edition .help-ico .svgi{width:42px;height:42px;stroke-width:1.5}
body.secondary-edition .dz-ico{color:#2F5FA7}body.secondary-edition .dz-ico .svgi{width:44px;height:44px;stroke-width:1.5}

/* ===== Hoja tipo Excel ===== */
body[data-view=cuadricula] .main,body[data-view=libreta] .main,body[data-view=actividades] .main{max-width:none;padding:22px 16px}
.sheet-wrap{--rowh:32px;--cellfs:15px}
.sheet-wrap.dens-normal{--rowh:40px;--cellfs:16px}.sheet-wrap.dens-wide{--rowh:52px;--cellfs:18px}
.sheet-wrap{border:1px solid #c9d4de;border-radius:10px;background:#fff}
.grid-wrap{max-height:calc(100vh - 250px)}
.sheet{border-collapse:separate;border-spacing:0;width:max-content;min-width:0;font-size:var(--cellfs);font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-right:1px solid #dbe3ea;border-bottom:1px solid #dbe3ea;padding:0 8px;height:var(--rowh);white-space:nowrap;text-align:center}
.sheet tr:last-child td{border-bottom:1px solid #dbe3ea}
.sheet thead th{position:sticky;top:0;z-index:4;background:#eef3f7;color:#2c3f52;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;height:auto;padding:4px 6px;white-space:normal;line-height:1.15;min-width:72px;max-width:130px}
.sheet .stickycol{position:sticky;left:0;z-index:2;background:#fff;text-align:left;width:190px;min-width:150px;max-width:230px;overflow:hidden;text-overflow:ellipsis;font-weight:700;border-right:2px solid #aebccb}
.sheet .rn{position:sticky;left:0;z-index:2;background:#eef3f7;color:#6a7b8c;width:34px;min-width:34px;max-width:34px;padding:0;font-size:12px;font-weight:600}
.gradegrid .rn+.stickycol{left:34px}
.sheet thead th.corner{z-index:6;text-align:left}.sheet thead th.rn{text-align:center}
.sheet thead th.stickycol{background:#eef3f7}
.sheet tbody tr:nth-child(even) td:not(.gc){background:#f8fafc}
.sheet tbody tr:nth-child(even) td.stickycol{background:#f8fafc}
.sheet tbody tr:hover td.stickycol,.sheet tbody tr:hover td.avgcell{background:#e6f2f5}
.sheet tr.cur td.stickycol,.sheet tr.cur td.rn{background:#FFE9A8;color:#3d2f00}
.sheet th.cur{background:#FFE9A8;color:#3d2f00}
.sheet td.gc{padding:0;min-width:72px;width:78px}
.gradegrid .avgcell,.gradegrid .avgh{position:sticky;right:0;z-index:2;background:#f4f8fa;border-left:2px solid #aebccb;min-width:96px}
.gradegrid thead th.avgh{z-index:5}
.sheet tfoot td{position:sticky;bottom:0;z-index:3;background:#eef3f7;font-weight:700;font-size:13px}
.sheet tfoot td.stickycol{z-index:5;background:#eef3f7}
.sheet .gcell,.sheet .grade-input{display:block;width:100%;height:calc(var(--rowh) - 1px);border:0;border-radius:0;background:transparent;text-align:center;font:inherit;font-weight:700;color:#1d2b3a;padding:0 4px;-moz-appearance:textfield;appearance:textfield}
.sheet .gcell::-webkit-outer-spin-button,.sheet .gcell::-webkit-inner-spin-button,.sheet .grade-input::-webkit-outer-spin-button,.sheet .grade-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet .gcell:focus,.sheet .grade-input:focus{outline:3px solid var(--accent);outline-offset:-3px;background:#fff;position:relative;z-index:1}
.sheet td.gc input.g-ok{background:#D5F0E0}.sheet td.gc input.g-mid{background:#FFF0B8}.sheet td.gc input.g-low{background:#FFD3D8}
.colbtn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;cursor:pointer;padding:3px 2px;border-radius:6px}
.colbtn:hover,.colbtn:focus-visible{background:#dfe9f0}.colbtn:focus-visible{outline:2px solid #3E8EDE}
.gh-name{font-weight:800;color:#203047;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.colbtn small{font-weight:600;color:#566b7e;font-size:12px}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.seg{display:flex;align-items:center;gap:4px}.seg-b{border:1px solid #cfdae5;background:#fff;padding:6px 12px;font-size:14px;font-weight:700;border-radius:8px;color:#35566b}
.seg-b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.colmenu{position:absolute;z-index:150;background:#fff;border:1px solid #c9d4de;border-radius:12px;box-shadow:0 10px 28px #1e3f5738;padding:6px;min-width:250px;display:flex;flex-direction:column}
.colmenu .cm-title{padding:8px 10px;font-weight:800;border-bottom:1px solid #edf0f4;margin-bottom:4px;display:flex;flex-direction:column}
.colmenu .cm-title small,.colmenu button small{font-weight:500;color:#566b7e;font-size:13px}
.colmenu button{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;font-size:15px;font-weight:600;color:#23415a}
.colmenu button:hover,.colmenu button:focus-visible{background:#E3F1F2}
@media print{.sheet-wrap{max-height:none!important;overflow:visible!important}.sheet .stickycol,.sheet thead th{position:static}}
.gradegrid th.gh,.gradegrid td.gc{width:84px;min-width:84px;max-width:84px}
.gradegrid th.gh,.gradegrid td.gc{width:92px;min-width:92px;max-width:92px}
.sheet-wrap{width:fit-content;max-width:100%}

/* Ruleta misteriosa */
.winner-name.hidden{font-size:96px;line-height:1.1;font-weight:900;color:var(--accent);text-align:center}
.winner-name.shown{text-align:center}
.winner-name.pop{animation:popin .65s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.mystery{text-align:center}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:300}
@media (prefers-reduced-motion:reduce){.winner-name.pop{animation:none}}

/* ===== v0.9: formas de calificar, rúbricas, PDA y ficha del alumno ===== */
.af .activity-create{margin-top:14px}
.check-inline{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:700;padding:11px 0;cursor:pointer}
.check-inline input{width:18px;height:18px;accent-color:var(--accent)}
.af-pda{border:1px solid #dce8ef;border-radius:12px;padding:10px 14px 12px;margin:12px 0 0;max-width:980px;background:#fbfdfe}
.af-pda legend{font-weight:750;font-size:14px;padding:0 6px}
.pda-pick{display:flex;gap:9px;align-items:flex-start;padding:6px 4px;font-size:14px;cursor:pointer;line-height:1.35}
.pda-pick input{margin-top:2px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.af-hint{min-height:1em;margin:8px 0 0}
.pda-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip.pda{background:#EEF3FB;color:#2B4A72;font-weight:600;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cuadrícula: casillas de marca, rúbrica y texto */
.sheet .gmark,.sheet .grub{cursor:pointer;font-size:calc(var(--cellfs) + 3px);line-height:1}
.sheet .gmark:hover,.sheet .grub:hover{background:#eef6f8}
.sheet .gmark.g-ok,.sheet .grub.g-ok{background:#D5F0E0;color:#0F5A3A}.sheet .gmark.g-mid,.sheet .grub.g-mid{background:#FFF0B8;color:#6B5200}.sheet .gmark.g-low,.sheet .grub.g-low{background:#FFD3D8;color:#8E1F30}
.sheet .grub{font-size:var(--cellfs)}
.sheet .grub.todo{color:#1d6f86;font-size:13px;text-decoration:underline;font-weight:700}
.sheet .grub.partial{background:repeating-linear-gradient(135deg,#fff 0 6px,#EEF4F7 6px 12px);color:#4b6375;font-size:13px}
.sheet .gtext{text-align:left!important;font-weight:500!important;font-size:14px;padding:0 8px!important}
.gradegrid th.gh.mode-text,.gradegrid td.gc:has(.gtext),#actTable td.gc:has(.gtext){width:220px;min-width:220px;max-width:220px}
#actTable td.gc{min-width:160px}
.sheet td.td-text{max-width:220px;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px}
.gradegrid th.gh small{white-space:nowrap}
.level-values{margin:12px 0}

/* rúbricas: biblioteca */
body[data-view=rubricas] .main,body[data-view=evaluar] .main,body[data-view=pda] .main{max-width:1600px}
.rub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:6px}
.rub-card{border:1px solid #dfe8ef;border-radius:14px;padding:14px;background:#fbfdfe}
.rub-card.open{grid-column:1/-1;background:#fff;border-color:#b9d3dc}
.rub-head{display:flex;gap:12px;align-items:center}
.rub-ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#E5ECF7;color:var(--accent-dark);font-size:22px;flex:none}
.rub-actions{margin-top:10px;gap:6px}
.danger-lite{color:#a83242!important}
.rub-preview{margin-top:12px;overflow-x:auto}
.share-box{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:18px;padding:14px 16px;border-radius:14px;background:#f5f9fb;border:1px solid #e1eaf0}
.share-box p{margin:4px 0 0;max-width:520px}
.dropzone.small{padding:10px 16px;border-width:2px;font-size:14px;flex-direction:column;gap:2px;border-radius:12px}
.dropzone.small span{font-size:12px;color:#5c7283}
.rubtable{border-collapse:collapse;width:100%;font-size:14px}
.rubtable th,.rubtable td{border:1px solid #d7e1e8;padding:8px 10px;vertical-align:top;text-align:left}
.rubtable thead th{background:#eef3f7;font-size:13px;color:#2c3f52}
.rubtable th small,.rubtable thead th small{display:block;font-weight:500;color:#5c7283;font-size:12px;margin-top:2px}
.rubtable tbody th{background:#f8fafc;width:200px}
.rubtable.cotejo td.box{width:70px}
.rubtable td.num{text-align:center;white-space:nowrap}

/* rúbricas: editor */
.rub-editor h3{margin-bottom:8px}
.rd-levels{margin:14px 0 6px}
.rd-level{display:flex;flex-direction:column;gap:4px;background:#f5f9fb;border:1px solid #e1eaf0;border-radius:10px;padding:8px}
.rd-level .field{min-width:130px;width:150px}
.field.pts{width:84px;min-width:70px}
.rd-table td{padding:6px}
.rd-table textarea{width:100%;min-width:160px;resize:vertical;font:inherit;font-size:14px}
.rd-table td:first-child textarea{min-width:200px}
.rd-w{white-space:nowrap;text-align:center}.rd-w small{display:block;color:#5c7283;margin-top:4px}

/* rúbricas: evaluar con un clic */
.back-row{margin-bottom:14px;gap:8px}
.eval-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.eval-list{display:flex;flex-direction:column;gap:3px;background:#fff;border:1px solid #e3eaf1;border-radius:16px;padding:8px;position:sticky;top:90px;max-height:calc(100vh - 120px);overflow:auto}
.eval-st{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;font-size:14px;color:#23415a;font-weight:600}
.eval-st span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eval-st:hover{background:#eef5f8}.eval-st.on{background:var(--accent);color:#fff}
.eval-st .es{flex:none;min-width:38px;text-align:center;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:800;background:#eef3f7;color:#566b7e}
.eval-st .es.partial{background:#FFF0D2;color:#7A4B00}
.eval-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.eval-head h2{margin:2px 0 0;font-size:28px;letter-spacing:-.02em}
.eval-score{display:flex;flex-direction:column;align-items:center;min-width:120px;padding:10px 18px;border-radius:16px;background:#eef3f7;color:#3b5266}
.eval-score b{font-size:34px;line-height:1.05}.eval-score small{font-size:12px;font-weight:700}
.eval-score.g-ok{background:#D5F0E0;color:#0F5A3A}.eval-score.g-mid{background:#FFF0B8;color:#6B5200}.eval-score.g-low{background:#FFD3D8;color:#8E1F30}
.eval-table td{padding:5px}
.rcell{width:100%;min-height:74px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:2px solid #dbe5ec;background:#fff;border-radius:11px;padding:9px 10px;font-size:13px;color:#33495c;line-height:1.3}
.rcell b{font-size:14px;color:#1f3448}
.rcell:hover{border-color:var(--accent);background:#f6fbfc}
.rcell.on{border-color:var(--accent-dark);background:var(--accent);color:#fff;box-shadow:0 0 0 3px #ffffff,0 0 0 5px var(--accent)}
.rcell.on b{color:#fff}
.eval-table.cotejo .rcell{min-height:48px;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.eval-table.cotejo .rcell.on.no{background:#8E1F30;border-color:#8E1F30;box-shadow:0 0 0 3px #fff,0 0 0 5px #8E1F30}
.eval-table.cotejo td{width:130px}
.eval-nav .spacer{flex:1}
@media(max-width:900px){.eval-layout{grid-template-columns:1fr}.eval-list{position:static;max-height:220px}}

/* PDA */
.pda-list{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:6px}
.pda-list li{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid #e6edf2;border-radius:11px;background:#fbfdfe}
.pda-n{font-weight:800;color:var(--accent-dark);text-align:center}
.pda-t{line-height:1.35}
.pda-copy{margin-top:8px}
.lvchip{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.pda-table td{min-width:96px}
.pda-table .linkbtn{font-size:14px;padding:0;text-align:left;font-weight:700;color:#1f3448}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp-row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.2fr);gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f5}
.cmp-label{line-height:1.35;font-size:14px}
.cmp-bars{display:flex;flex-direction:column;gap:6px}
.bar-line{display:grid;grid-template-columns:76px 1fr 96px;gap:8px;align-items:center;font-size:13px}

.ficha-sign div{flex:1;max-width:260px}.ficha-sign span{display:block;border-top:1px solid #33495c;margin-bottom:4px}

/* impresión de una sola cosa (rúbrica o fichas) */
#printArea{display:none}

  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff!important}
  .print-page{break-after:page;page-break-after:always;padding:0;max-width:none}
  .print-page:last-child{break-after:auto;page-break-after:auto}
  .print-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:10px;font-size:13px}

  #printArea .ficha{font-size:12px}#printArea .ficha table{font-size:12px}
}

  const data=new TextEncoder().encode(str),l=data.length,bitLen=l*8,total=((l+9+63)>>6)<<6,buf=new Uint8Array(total);
  buf.set(data);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(total-8,Math.floor(bitLen/4294967296));dv.setUint32(total-4,bitLen>>>0);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),W=new Uint32Array(64);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<total;o+=64){
    for(let t=0;t<16;t++)W[t]=dv.getUint32(o+t*4);
    for(let t=16;t<64;t++){const s0=rotr(W[t-15],7)^rotr(W[t-15],18)^(W[t-15]>>>3),s1=rotr(W[t-2],17)^rotr(W[t-2],19)^(W[t-2]>>>10);W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+SHA_K[t]+W[t])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }

}

/* Color */
function hexToRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function rgbToHex(r){return '#'+r.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase()}
function tint(hex,p){return rgbToHex(hexToRgb(hex).map(v=>v+(255-v)*p))}   /* mezcla con blanco */
function isDark(hex){const [r,g,b]=hexToRgb(hex);return (0.299*r+0.587*g+0.114*b)<150}
function textOn(hex){return isDark(hex)?'#FFFFFF':'#1F2D3D'}

ICON_FOR_VIEW.opciones='settings';ICON_FOR_VIEW.rubros='scale';ICON_FOR_VIEW.niveles='grades';

/* ===== 30_state.js — estado, validación, migración y guardado ===== */
const SCHEMA=9;
const ID_RE=/^[A-Za-z0-9_-]{1,64}$/;
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
const ATT_CODES=['P','F','FJ','FI'];
let loadWarning='';

function defaultProfile(){return {teacher:'',school:'',cycle:'',shift:'',grade:'',group:'',period:'1',onboarded:false,schedule:[]}}

/* v0.9: una rúbrica (o lista de cotejo). Lanza Error si no es válida.
   {id,name,kind:'rubrica'|'cotejo',levels:[{n,p}],criteria:[{id,n,w,d:[texto por nivel],pda}]} */
function normalizeRubric(r){
  const fail=m=>{throw new Error(m)},isObj=o=>o&&typeof o==='object'&&!Array.isArray(o),str=(v,max)=>typeof v==='string'?v.trim().slice(0,max):'';
  if(!isObj(r)||typeof r.id!=='string'||!ID_RE.test(r.id))fail('Una rúbrica tiene un identificador no válido.');
  const kind=r.kind==='cotejo'?'cotejo':'rubrica';
  let levels;
  if(kind==='cotejo')levels=copy(COTEJO_LEVELS);
  else{
    if(!Array.isArray(r.levels)||r.levels.length<2||r.levels.length>6)fail('La rúbrica «'+str(r.name,60)+'» debe tener de 2 a 6 niveles.');
    levels=r.levels.map((l,i)=>{const p=Number(isObj(l)?l.p:NaN);if(!Number.isFinite(p)||p<0||p>100)fail('Un nivel tiene un puntaje no válido.');return {n:str(l.n,40)||('Nivel '+(i+1)),p:round2(p)}});
    if(!(Math.max(...levels.map(l=>l.p))>0))fail('Al menos un nivel debe valer más de cero.');
  }
  if(!Array.isArray(r.criteria)||!r.criteria.length||r.criteria.length>30)fail('La rúbrica «'+str(r.name,60)+'» debe tener de 1 a 30 criterios.');
  const ids=new Set();
  const criteria=r.criteria.map((c,i)=>{
    if(!isObj(c))fail('Un criterio no es válido.');
    const id=typeof c.id==='string'&&ID_RE.test(c.id)&&!ids.has(c.id)?c.id:'c'+(i+1)+'_'+Math.random().toString(36).slice(2,6);ids.add(id);
    const w=Number(c.w);if(!Number.isFinite(w)||w<=0||w>100)fail('El criterio «'+str(c.n,60)+'» debe valer entre 0.1 y 100.');
    const d=levels.map((_,j)=>str(Array.isArray(c.d)?c.d[j]:'',400));
    return {id,n:str(c.n,200)||('Criterio '+(i+1)),w:round2(w),d,pda:typeof c.pda==='string'&&ID_RE.test(c.pda)?c.pda:''};
  });
  return {id:r.id,name:str(r.name,100)||'Rúbrica',kind,levels,criteria};
}

/* Valida y normaliza cualquier estado (datos locales o respaldos). Lanza Error con un mensaje claro si es inválido.
   Todos los identificadores deben ser seguros porque se insertan en atributos HTML. */
function normalizeState(raw,opt={}){
  const strict=!!opt.strict,fail=m=>{throw new Error(m)},isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
  const okId=v=>typeof v==='string'&&ID_RE.test(v),str=(v,max=200)=>typeof v==='string'?v.trim().slice(0,max):'';
  if(!isObj(raw))fail('El archivo no contiene datos de '+APP_NAME+'.');
  if(!Array.isArray(raw.groups))fail('Faltan los grupos en los datos.');
  const s={schema:SCHEMA},groupIds=new Set(),studentIds=new Set();
  s.groups=raw.groups.map(g=>{
    if(!isObj(g)||!okId(g.id))fail('Un grupo tiene un identificador no válido.');
    if(groupIds.has(g.id))fail('Hay dos grupos con el mismo identificador.');groupIds.add(g.id);
    if(g.level&&g.level!==EDITION&&strict)fail('Este archivo corresponde a la edición '+g.level+'. Usa un respaldo de '+EDITION+'.');
    const ng={id:g.id,name:str(g.name,80)||'Grupo',level:EDITION,archived:!!g.archived,students:[]};
    for(const st of (Array.isArray(g.students)?g.students:[])){
      if(!isObj(st)||!okId(st.id))fail('Un alumno tiene un identificador no válido.');
      if(studentIds.has(st.id))continue;studentIds.add(st.id);
      const name=str(st.name,130);if(!name)continue;
      ng.students.push({id:st.id,name,...(st.inactive?{inactive:true}:{})});
    }
    ng.students.sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}));
    if(EDITION==='Secundaria')ng.disciplines=[...new Set((Array.isArray(g.disciplines)?g.disciplines:[]).filter(d=>DISCIPLINAS.some(x=>x.id===d)))];
    return ng;
  });
  const gOk=id=>groupIds.has(id);
  /* Asistencia: 'idGrupo|AAAA-MM-DD' -> {idAlumno: P|F|FJ|FI} */
  s.attendance={};
  if(isObj(raw.attendance))for(const [k,v] of Object.entries(raw.attendance)){
    const [g,d,...rest]=k.split('|');if(rest.length||!gOk(g)||!DATE_RE.test(d||'')||!isObj(v))continue;
    const rec={};for(const [sid,st] of Object.entries(v))if(okId(sid)&&ATT_CODES.includes(st))rec[sid]=st;
    s.attendance[k]=rec;
  }
  /* v0.8: dentro de una lista guardada, quien no tenga registro se interpreta como en v0.7 (Falta) para no cambiar datos viejos */
  if((Number(raw.schema)||0)<8){
    for(const [k,rec] of Object.entries(s.attendance)){const g=s.groups.find(x=>x.id===k.split('|')[0]);if(!g)continue;for(const st of g.students)if(!st.inactive&&rec[st.id]===undefined)rec[st.id]='F'}
  }
  /* v0.9: PDA por grupo y campo/disciplina: 'idGrupo|idAlcance' -> [{id,t}] */
  s.pdas={};const pdaIds=new Set();
  if(isObj(raw.pdas))for(const [k,list] of Object.entries(raw.pdas)){
    const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!okId(sc)||!Array.isArray(list))continue;
    const out=[];for(const x of list.slice(0,120)){if(!isObj(x)||!okId(x.id)||pdaIds.has(x.id))continue;const t=str(x.t,400);if(!t)continue;pdaIds.add(x.id);out.push({id:x.id,t})}
    if(out.length)s.pdas[k]=out;
  }
  const pdaOk=(g,sc,id)=>(s.pdas[g+'|'+sc]||[]).some(x=>x.id===id);
  /* v0.12 (Primaria) y v0.13 (Secundaria): rubros por grupo y campo formativo o disciplina: 'idGrupo|idAlcance' -> {pct, items:[{id,name,w}]}.
     Si un grupo/alcance aún no tiene lista se usan los rubros por omisión (Actividad, Proyecto, Examen) con ids fijos.
     Las ponderaciones antiguas (weights: Actividad/Proyecto/Examen) se convierten en rubros con porcentaje. */
  s.rubros={};
  const scopeOk=sc=>EDITION==='Primaria'?CAMPOS.some(c=>c.id===sc):DISCIPLINAS.some(d=>d.id===sc);
  {
    const normR=v=>{
      if(!isObj(v)||!Array.isArray(v.items))return null;const ids=new Set(),names=new Set(),items=[];
      for(const it of v.items.slice(0,12)){if(!isObj(it)||!okId(it.id)||ids.has(it.id))continue;const name=str(it.name,40);if(!name||names.has(normName(name)))continue;
        const w=Number(it.w);ids.add(it.id);names.add(normName(name));items.push({id:it.id,name,w:Number.isFinite(w)&&w>=0&&w<=100?Math.round(w*10)/10:0})}
      if(!items.length)return null;
      const sum=items.reduce((a,x)=>a+x.w,0);return {pct:v.pct===true&&Math.abs(sum-100)<0.01,items};
    };
    if(isObj(raw.rubros))for(const [k,v] of Object.entries(raw.rubros)){const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!scopeOk(sc))continue;const n=normR(v);if(n)s.rubros[k]=n}
    if(isObj(raw.weights))for(const [k,v] of Object.entries(raw.weights)){const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!scopeOk(sc)||s.rubros[k]||!isObj(v))continue;
      const d=defaultRubros();d.items.forEach(it=>{const n=Number(v[RUBRO_FROM_TIPO_NAME[it.id]]);it.w=Number.isFinite(n)&&n>=0&&n<=100?n:0});d.pct=Math.abs(d.items.reduce((a,x)=>a+x.w,0)-100)<0.01;s.rubros[k]=d}
  }
  const rubroListOf=(g,sc)=>(s.rubros[g+'|'+sc]||defaultRubros()).items;
  /* Actividades (las antiguas sin campo/disciplina se conservan para reasignarlas) */
  const actIds=new Set();
  s.activities=(Array.isArray(raw.activities)?raw.activities:[]).filter(a=>isObj(a)&&okId(a.id)&&okId(a.groupId)&&gOk(a.groupId)&&!actIds.has(a.id)&&Number.isFinite(Number(a.max))&&Number(a.max)>0).map(a=>{
    actIds.add(a.id);
    const scope=(typeof a.scopeId==='string'&&ID_RE.test(a.scopeId))?a.scopeId:'';
    const na={id:a.id,groupId:a.groupId,name:str(a.name,120)||'Actividad',date:DATE_RE.test(a.date||'')?a.date:todayISO(),max:Number(a.max),
      type:TIPOS.includes(a.type)?a.type:'Actividad',scopeId:scope,
      period:['1','2','3'].includes(String(a.period))?String(a.period):'1',archived:!!a.archived,notes:str(a.notes,500),
      mode:MODE_IDS.includes(a.mode)?a.mode:'num',counts:a.counts!==false,
      pdas:[...new Set((Array.isArray(a.pdas)?a.pdas:[]).filter(id=>okId(id)&&pdaOk(a.groupId,scope,id)))]};
    {   /* cada actividad pertenece a un rubro de su campo o disciplina */
      const list=rubroListOf(a.groupId,scope);let rid=typeof a.rubro==='string'&&list.some(x=>x.id===a.rubro)?a.rubro:'';
      if(!rid){const byName=list.find(x=>normName(x.name)===normName(na.type));rid=(byName||list.find(x=>x.id===TIPO_TO_RUBRO[na.type])||list[0]).id}
      na.rubro=rid;
    }
    if(na.mode==='rubric'){
      try{na.rubric=normalizeRubric(a.rubric);na.rubric.criteria.forEach(c=>{if(c.pda&&!pdaOk(a.groupId,scope,c.pda))c.pda=''});na.rubricFrom=str(a.rubricFrom,100)}
      catch(e){na.mode='num'}   /* una rúbrica dañada no tumba los demás datos: la columna queda como número, sin notas */
    }
    if(na.mode!=='num'){na.max=10}
    if(na.mode!=='icon'&&na.mode!=='level')na.counts=true;
    return na;
  });
  const actById=Object.fromEntries(s.activities.map(a=>[a.id,a]));
  s.grades={};
  if(isObj(raw.grades))for(const [k,v] of Object.entries(raw.grades)){const [a,st,...r]=k.split('|');if(r.length||!actIds.has(a)||actById[a].mode!=='num'||!okId(st))continue;const n=Number(v);if(Number.isFinite(n)&&n>=0)s.grades[k]=n}
  /* v0.9: marcas (✓ ◐ ✗ o niveles), rúbricas calificadas y observaciones escritas */
  s.marks={};
  if(isObj(raw.marks))for(const [k,v] of Object.entries(raw.marks)){const [a,st,...r]=k.split('|');const act=actById[a];if(r.length||!act||!okId(st))continue;
    if((act.mode==='icon'&&ICON_MARKS.some(m=>m.c===v))||(act.mode==='level'&&LEVEL_MARKS.some(m=>m.c===v)))s.marks[k]=v}
  s.rscores={};
  if(isObj(raw.rscores))for(const [k,v] of Object.entries(raw.rscores)){const [a,st,...r]=k.split('|');const act=actById[a];if(r.length||!act||act.mode!=='rubric'||!okId(st)||!isObj(v))continue;
    const rec={};for(const c of act.rubric.criteria){const n=v[c.id];if(Number.isInteger(n)&&n>=0&&n<act.rubric.levels.length)rec[c.id]=n}
    if(Object.keys(rec).length)s.rscores[k]=rec}
  s.obs={};
  if(isObj(raw.obs))for(const [k,v] of Object.entries(raw.obs)){const [a,st,...r]=k.split('|');const act=actById[a];if(r.length||!act||act.mode!=='text'||!okId(st))continue;const t=str(v,300);if(t)s.obs[k]=t}
  s.extra={};
  if(isObj(raw.extra))for(const [k,v] of Object.entries(raw.extra)){const [g,st,...r]=k.split('|');if(r.length||!gOk(g)||!okId(st))continue;const n=Number(v);if(Number.isFinite(n)&&Number.isInteger(n))s.extra[k]=n}
  s.weights={};
  if(isObj(raw.weights))for(const [k,v] of Object.entries(raw.weights)){const [g,sc,...r]=k.split('|');if(r.length||!gOk(g)||!okId(sc)||!isObj(v))continue;const w={};let good=true;for(const t of TIPOS){const n=Number(v[t]);if(!Number.isFinite(n)||n<0||n>100)good=false;w[t]=n}if(good)s.weights[k]=w}
  /* Perfil y horario */
  const p=isObj(raw.profile)?raw.profile:{};
  s.profile={...defaultProfile(),teacher:str(p.teacher,120),school:str(p.school,160),cycle:str(p.cycle,20),shift:SHIFTS.includes(p.shift)?p.shift:'',grade:str(p.grade,20),
    group:okId(p.group)&&gOk(p.group)?p.group:'',period:['1','2','3'].includes(String(p.period))?String(p.period):'1',schedule:[]};
  /* Asistente de bienvenida: sólo para quien aún tiene únicamente el grupo de demostración sin uso */
  const pristine=raw.groups.length===1&&['g1','g2'].includes(raw.groups[0].id)&&!(Array.isArray(raw.activities)&&raw.activities.length)&&!Object.keys(isObj(raw.attendance)?raw.attendance:{}).length&&!s.profile.teacher;
  s.profile.onboarded=p.onboarded===true||!pristine;
  for(const x of (Array.isArray(p.schedule)?p.schedule:[])){
    if(!isObj(x)||!DAYS.includes(x.day)||!okId(x.groupId)||!gOk(x.groupId)||!okId(x.scopeId)||!TIME_RE.test(x.start||'')||!TIME_RE.test(x.end||'')||x.start>=x.end)continue;
    s.profile.schedule.push({id:okId(x.id)?x.id:gid(),day:x.day,groupId:x.groupId,scopeId:x.scopeId,start:x.start,end:x.end});
  }
  /* Equipos guardados */
  s.teamSets={};
  if(isObj(raw.teamSets))for(const [g,list] of Object.entries(raw.teamSets)){
    if(!gOk(g)||!Array.isArray(list))continue;
    s.teamSets[g]=list.filter(x=>isObj(x)&&okId(x.id)&&Array.isArray(x.teams)).map(x=>({id:x.id,name:str(x.name,80)||'Equipos',date:DATE_RE.test(x.date||'')?x.date:todayISO(),mode:x.mode==='manual'?'manual':'auto',
      teams:x.teams.filter(isObj).map((t,i)=>({name:str(t.name,60)||('Equipo '+(i+1)),students:(Array.isArray(t.students)?t.students:[]).filter(okId)}))}));
  }
  /* Configuración, historial de cambios y filtros */
  const st=isObj(raw.settings)?raw.settings:{};
  s.settings={bigText:st.bigText===true,sheetDensity:['compact','normal','wide'].includes(st.sheetDensity)?st.sheetDensity:'compact',attRule:st.attRule==='withJustified'?'withJustified':'strict',alertPct:Number.isFinite(Number(st.alertPct))&&Number(st.alertPct)>=1&&Number(st.alertPct)<=100?Math.round(Number(st.alertPct)):80,
    levelValues:Object.fromEntries(LEVEL_MARKS.map(m=>{const n=Number(isObj(st.levelValues)?st.levelValues[m.c]:NaN);return [m.c,Number.isFinite(n)&&n>=0&&n<=10?round2(n):LEVEL_DEFAULTS[m.c]]})),
    /* v0.10: tema de colores (la validación usa literales: este código corre antes de cargar 47_theme.js) */
    theme:['default','alegre','oscuro','custom'].includes(st.theme)?st.theme:'default',
    custom:(()=>{const c=isObj(st.custom)?st.custom:{},d=defaultCustom(),hx=v=>typeof v==='string'&&/^#[0-9A-Fa-f]{6}$/.test(v)?v.toUpperCase():null;return {accent:hx(c.accent)||d.accent,bg:hx(c.bg)||d.bg,base:c.base==='dark'?'dark':'light'}})()};
  s.attendanceLog=(Array.isArray(raw.attendanceLog)?raw.attendanceLog:[]).filter(e=>isObj(e)&&Number.isFinite(e.t)&&okId(e.g||'')&&DATE_RE.test(e.d||'')&&okId(e.s||'')).slice(-3000)
    .map(e=>({t:e.t,g:e.g,d:e.d,s:e.s,from:ATT_CODES.includes(e.from)?e.from:'-',to:ATT_CODES.includes(e.to)?e.to:'-'}));
  s.notebookFilter={};
  if(isObj(raw.notebookFilter))for(const [g,v] of Object.entries(raw.notebookFilter)){if(!gOk(g))continue;s.notebookFilter[g]=Array.isArray(v)?v.filter(okId):null}
  /* v0.9: biblioteca de rúbricas del docente y observaciones generales por alumno y periodo */
  s.rubrics=[];const rubIds=new Set();
  for(const r of (Array.isArray(raw.rubrics)?raw.rubrics:[]).slice(0,300)){try{const n=normalizeRubric(r);if(rubIds.has(n.id)||n.id.startsWith('bank_'))continue;rubIds.add(n.id);n.criteria.forEach(c=>{c.pda=''});s.rubrics.push(n)}catch(e){}}
  s.studentNotes={};
  if(isObj(raw.studentNotes))for(const [k,v] of Object.entries(raw.studentNotes)){const [g,st,p,...r]=k.split('|');if(r.length||!gOk(g)||!okId(st)||!['1','2','3'].includes(p))continue;const t=str(v,1500);if(t)s.studentNotes[k]=t}
  s.lastBackup=typeof raw.lastBackup==='string'&&!Number.isNaN(Date.parse(raw.lastBackup))?raw.lastBackup:'';
  return s;
}

/* Carga: v0.7 -> v0.6 -> v0.5 -> v0.4. Las claves antiguas NUNCA se borran (sirven de copia de seguridad).
   Si algo está dañado se conserva el texto original aparte y se avisa; no se descarta en silencio. */
function loadState(){
  const keys=[KEY,...['v08','v07','v06','v05','v04'].map(v=>KEY.replace('v09',v))];
  for(const k of keys){
    let raw=null;try{raw=localStorage.getItem(k)}catch(e){}
    if(!raw)continue;
    try{
      const s=normalizeState(JSON.parse(raw));
      if(k!==KEY)loadWarning='';
      return s;
    }catch(e){
      try{localStorage.setItem(KEY+'_dañado_'+Date.now(),raw)}catch(_){}
      loadWarning='Se encontraron datos guardados que no se pudieron leer ('+e.message+'). Se conservó una copia aparte y se inició con datos de demostración. Si tienes un respaldo, restáuralo en «Mis respaldos».';
    }
  }
  return normalizeState(copy(seed));
}
let state=loadState();
let storageOk=true;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true;if(typeof abSchedule==='function')abSchedule()}
  catch(e){storageOk=false;if(typeof notify==='function')notify('No se pudo guardar en este navegador. Descarga una copia de seguridad ahora.','error',{ms:30000});if(!window.__saveAlerted){window.__saveAlerted=1;alert('No se pudo guardar en este navegador (almacenamiento lleno o bloqueado). Guarda una copia en «Más › Copias de seguridad» antes de continuar.')}}
}
/* Contadores para mensajes de confirmación */
function countsOf(s){return {groups:s.groups.length,students:s.groups.reduce((n,g)=>n+g.students.length,0),activities:s.activities.length}}

/* ===== 40_core.js — variables de interfaz, alcances (campo/disciplina) y promedios ===== */
let active='inicio',selectedGroup='',currentDate=todayISO(),currentPeriod=state.profile.period||'1',scopeByGroup={},gradeActivityId='';
let editingActivity='',attRange={from:'',to:''},studentQuery='';
let rouletteBusy=false,rouletteAngle=0,rouletteWinner=null,rouletteRemaining={};

function activeGroups(){return state.groups.filter(g=>!g.archived)}
function roster(g){return g?g.students.filter(s=>!s.inactive):[]}
function group(){return state.groups.find(g=>g.id===selectedGroup&&!g.archived)}
function liveActivities(){return state.activities.filter(a=>!a.archived)}
function groupNameTaken(name,exceptId){const n=normName(name);return state.groups.some(g=>!g.archived&&g.id!==exceptId&&normName(g.name)===n)}

function scopesForGroup(g){if(!g)return[];return g.level==='Primaria'?CAMPOS:DISCIPLINAS.filter(d=>(g.disciplines||[]).includes(d.id))}
function scopeId(g){const list=scopesForGroup(g);let id=scopeByGroup[g?.id];if(!list.some(x=>x.id===id)){id=list[0]?.id||'';if(g)scopeByGroup[g.id]=id}return id}
function scopeName(g,id){return scopesForGroup(g).find(x=>x.id===id)?.name||'Sin clasificar'}
function scopeArea(g,id){if(!g)return'';return g.level==='Primaria'?'':CAMPOS.find(c=>c.id===DISCIPLINAS.find(d=>d.id===id)?.campo)?.name||''}
function periodLabel(g){return (g?.level||EDITION)==='Primaria'?'Trimestre':'Periodo'}
function scopedActivities(g,scope=scopeId(g),period=currentPeriod){return liveActivities().filter(a=>a.groupId===g?.id&&a.scopeId===scope&&String(a.period||'1')===period)}
function pendingActivities(g){return state.activities.filter(a=>a.groupId===g?.id&&!a.scopeId&&!a.archived)}

/* ---------- Promedio provisional (documentado en docs/CALCULO_DE_PROMEDIOS.md) ----------
   · Cada calificación se lleva a escala 0–10: nota / máximo × 10.
   · Sólo cuentan las actividades CALIFICADAS; una pendiente (casilla vacía) NO es cero; un 0 escrito sí cuenta.
   · Sin ponderaciones: promedio simple de las actividades calificadas.
   · Con ponderaciones: promedio de cada tipo con notas, combinado con su peso; los tipos sin notas
     (o con peso 0) se excluyen y los pesos restantes se normalizan.
   · Sin calificaciones => null (se muestra «Sin calificaciones»). */
/* v0.9: cada actividad se califica de una de cinco formas (a.mode). scoreOf devuelve los puntos (0..máx) o undefined si está pendiente. */
function levelValue(code){const v=state.settings?.levelValues?.[code];return Number.isFinite(v)?v:LEVEL_DEFAULTS[code]}
function rubricMaxPts(r){return Math.max(...r.levels.map(l=>l.p))}
/* Rúbrica: nota = Σ(peso × puntos del nivel elegido) ÷ (Σ pesos × puntos del mejor nivel) × máximo. Sólo con TODOS los criterios marcados. */
function rubricResult(a,sid){
  const r=a.rubric,rec=state.rscores[a.id+'|'+sid]||{},mp=rubricMaxPts(r);let wsum=0,acc=0,done=0;
  for(const c of r.criteria){wsum+=c.w;const li=rec[c.id];if(li===undefined||!r.levels[li])continue;done++;acc+=c.w*r.levels[li].p/mp}
  return {done,total:r.criteria.length,frac:done===r.criteria.length&&wsum>0?acc/wsum:null};
}
function scoreOf(a,sid){
  const k=a.id+'|'+sid;
  if(a.mode==='icon'){const m=ICON_MARKS.find(x=>x.c===state.marks[k]);return m?m.pct*a.max:undefined}
  if(a.mode==='level'){const c=state.marks[k];return c?levelValue(c)/10*a.max:undefined}
  if(a.mode==='rubric'){const r=rubricResult(a,sid);return r.frac===null?undefined:r.frac*a.max}
  if(a.mode==='text')return undefined;
  const v=state.grades[k];return v===undefined?undefined:Number(v);
}
function countsInAverage(a){return a.mode!=='text'&&a.counts!==false}
function hasEvaluation(a,sid){const k=a.id+'|'+sid;return a.mode==='text'?!!state.obs[k]:a.mode==='rubric'?!!state.rscores[k]:(a.mode==='icon'||a.mode==='level')?!!state.marks[k]:state.grades[k]!==undefined}
function activityHasData(a){const pre=a.id+'|';return [state.grades,state.marks,state.rscores,state.obs].some(m=>Object.keys(m).some(k=>k.startsWith(pre)))}
function clearActivityData(id){const pre=id+'|';for(const m of [state.grades,state.marks,state.rscores,state.obs])for(const k of Object.keys(m))if(k.startsWith(pre))delete m[k]}
/* Texto corto para mostrar una casilla (cuaderno, ficha, Excel) */
function cellText(a,sid,long){
  const k=a.id+'|'+sid;
  if(a.mode==='icon'){const m=ICON_MARKS.find(x=>x.c===state.marks[k]);return m?(long?m.sym+' '+m.name:m.sym):''}
  if(a.mode==='level'){const m=LEVEL_MARKS.find(x=>x.c===state.marks[k]);return m?(long?m.name:m.sym):''}
  if(a.mode==='text')return state.obs[k]||'';
  if(a.mode==='rubric'){const r=rubricResult(a,sid);return r.frac!==null?numfmt(round2(r.frac*a.max)):(r.done?`${r.done} de ${r.total} criterios`:'')}
  const v=state.grades[k];return v===undefined?'':numfmt(v);
}
function gradeOnTen(a,sid){const v=scoreOf(a,sid);return v===undefined?null:v/Number(a.max)*10}
function averageInScope(g,scope,student,activities){
  const graded=activities.filter(a=>countsInAverage(a)&&scoreOf(a,student.id)!==undefined);
  if(!graded.length)return null;
  {   /* v0.12/v0.13: rubros del campo o disciplina, con o sin porcentaje */
    const R=rubrosOf(g,scope.id);
    if(!R.pct)return graded.reduce((x,a)=>x+gradeOnTen(a,student.id),0)/graded.length;
    let total=0,den=0;
    for(const it of R.items){
      const subset=graded.filter(a=>a.rubro===it.id);if(!subset.length||!(it.w>0))continue;
      total+=it.w*subset.reduce((x,a)=>x+gradeOnTen(a,student.id),0)/subset.length;den+=it.w;
    }
    return den?total/den:null;
  }
}
function averageLabel(v){return v===null||v===undefined?'Sin calificaciones':numfmt(v)}
function meanOf(vals){const n=vals.filter(x=>x!==null&&x!==undefined);return n.length?n.reduce((a,b)=>a+b,0)/n.length:null}

/* Bloques del cuaderno (uno por campo/disciplina) con el filtro del docente aplicado */
function fullNotebookData(g){
  return scopesForGroup(g).map(scope=>({scope,color:scopeColor(scope.id),activities:scopedActivities(g,scope.id,currentPeriod)}));
}
function nbFilter(g){const f=state.notebookFilter?.[g?.id];return Array.isArray(f)?new Set(f):null}

/* ---------- v0.9: PDA (Procesos de Desarrollo de Aprendizaje) ----------
   Cada grupo guarda sus PDA por campo formativo o disciplina. Una actividad completa o un criterio de rúbrica pueden ligarse a un PDA.
   Avance de un alumno en un PDA = promedio (0–10) de todas sus evidencias ligadas; si un criterio de la rúbrica ya está ligado a ese PDA,
   la actividad completa no se cuenta otra vez para el mismo PDA. */
/* v0.12: en Primaria los PDA están ocultos por ahora (los datos no se borran) */
function pdaEnabled(){return false}
function pdaList(g,scope){return g&&pdaEnabled()?(state.pdas[g.id+'|'+scope]||[]):[]}
function pdaEvidence(pdaId,sid,acts){
  const vals=[];
  for(const a of acts){
    if(a.mode==='rubric'&&a.rubric.criteria.some(c=>c.pda===pdaId)){
      const rec=state.rscores[a.id+'|'+sid]||{},mp=rubricMaxPts(a.rubric);
      for(const c of a.rubric.criteria)if(c.pda===pdaId&&rec[c.id]!==undefined)vals.push(a.rubric.levels[rec[c.id]].p/mp*10);
    }else if((a.pdas||[]).includes(pdaId)){const v=gradeOnTen(a,sid);if(v!==null)vals.push(v)}
  }
  return vals;
}
function pdaLinked(pdaId,acts){return acts.filter(a=>(a.pdas||[]).includes(pdaId)||(a.mode==='rubric'&&a.rubric.criteria.some(c=>c.pda===pdaId)))}
function pdaProgress(g,scope,acts){
  const ros=roster(g);
  return pdaList(g,scope).map(p=>{
    const per=Object.fromEntries(ros.map(st=>[st.id,meanOf(pdaEvidence(p.id,st.id,acts))]));
    return {pda:p,linked:pdaLinked(p.id,acts).length,per,group:meanOf(Object.values(per))};
  });
}

/* ---------- Avisos que no bloquean (reemplazan a alert) ---------- */
let toastLog=[];
function notify(msg,kind,opt){
  kind=kind||'info';opt=opt||{};toastLog.push({msg:String(msg),kind,t:Date.now()});
  let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';box.setAttribute('aria-live','polite');document.body.appendChild(box)}
  while(box.children.length>=4)box.firstChild.remove();
  const el=document.createElement('div');el.className='toast '+kind;el.setAttribute('role',kind==='error'?'alert':'status');
  const icon={success:'✓',error:'⚠',info:'ℹ'}[kind]||'ℹ',ic=document.createElement('span');ic.className='toast-ic';ic.textContent=icon;el.appendChild(ic);
  const span=document.createElement('span');span.className='toast-msg';span.textContent=msg;el.appendChild(span);
  if(opt.undo){const b=document.createElement('button');b.className='toast-undo';b.textContent='↶ Deshacer';b.onclick=()=>{el.remove();opt.undo()};el.appendChild(b)}
  const x=document.createElement('button');x.className='toast-x';x.setAttribute('aria-label','Cerrar aviso');x.textContent='×';x.onclick=()=>el.remove();el.appendChild(x);
  box.appendChild(el);setTimeout(()=>el.remove(),opt.ms||(kind==='error'?14000:8000));return el;
}
function warn(msg){notify(msg,'error')}
function lastNotice(){return toastLog.length?toastLog[toastLog.length-1].msg:''}

/* ---------- Deshacer ----------
   Las acciones que se pueden revertir (ocultar, retirar, rellenar notas…) se hacen al instante y ofrecen «Deshacer» 12 s.
   Lo irreversible (eliminar definitivamente, reemplazar datos) sigue pidiendo confirmación con el detalle exacto. */
function withUndo(label,fn){
  const snap=JSON.stringify(state);fn();save();render();
  notify(label,'success',{ms:12000,undo:()=>{state=normalizeState(JSON.parse(snap));save();if(typeof applyTheme==='function')applyTheme();render();notify('Listo, se deshizo: '+label,'info')}});
}

/* ---------- Confeti (se omite si la persona pidió menos animación) ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.getElementById('confetti')?.remove();
  const cv=document.createElement('canvas');cv.id='confetti';cv.setAttribute('aria-hidden','true');cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const ctx=cv.getContext('2d'),cols=(typeof ROULETTE_COLORS!=='undefined'&&ROULETTE_COLORS.length)?ROULETTE_COLORS:['#FA704C','#FFBA61','#55C1B4','#A88BE7'];
  const el=document.getElementById('winnerName'),r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0},ox=r.left+r.width/2,oy=r.top+r.height/2;
  const P=Array.from({length:170},()=>{const a=-Math.PI/2+(Math.random()-.5)*2.4,v=6+Math.random()*10;return {x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*5,rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],life:0}});
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);f++;
    for(const p of P){p.vy+=.32;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,(200-p.life)/50));ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(f<200&&document.getElementById('confetti')===cv)requestAnimationFrame(tick);else cv.remove();
  })();
}

/* ===== 47_theme.js — v0.10: temas de color (Predeterminado, Alegre, Oscuro y Personalizado) =====
   · «Predeterminado» no toca nada: es la identidad de cada edición.

     para que el texto blanco se lea (contraste mínimo 4.5 : 1). */

const THEME_IDS=THEMES.map(t=>t.id);

const BG_SWATCHES=['#F3F6F9','#FFF4E6','#FDECF4','#EDF7EE','#EEF0FF','#F6F1E9'];
const ALEGRE={accent:'#7C3AED'};
const DARK_SURFACE='#18222C',DARK_PAGE='#10171E';
function defaultCustom(){return {accent:EDITION_ACCENT[EDITION].main.toUpperCase(),bg:EDITION==='Primaria'?'#FFF4E6':'#F3F6F9',base:'light'}}

/* --- color: luminancia y contraste (WCAG 2) --- */
function relLum(hex){return hexToRgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
function contrast(a,b){const x=relLum(a),y=relLum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function mix(a,b,p){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.map((v,i)=>v+(B[i]-v)*p))}   /* p = cuánto de b */
function darkenFor(hex,against,min){let c=hex;for(let i=0;i<40&&contrast(c,against)<min;i++)c=mix(c,'#000000',.06);return c}
function lightenFor(hex,against,min){let c=hex;for(let i=0;i<40&&contrast(c,against)<min;i++)c=mix(c,'#FFFFFF',.08);return c}

/* Variables que se ponen en <body> según el tema; null = predeterminado (sin cambios) */
function themeVars(theme,custom){
  if(theme==='default')return null;
  const dark=theme==='oscuro'||(theme==='custom'&&custom.base==='dark');
  const src=theme==='alegre'?ALEGRE.accent:theme==='custom'?custom.accent:EDITION_ACCENT[EDITION].main;
  const accent=darkenFor(src,'#FFFFFF',4.5),accentDark=mix(accent,'#000000',.22);
  const v={'--brand':src,'--accent':accent,'--accent-dark':accentDark,'--nav-on':dark?mix(src,DARK_SURFACE,.72):mix(src,'#FFFFFF',.86)};
  v['--soft']=v['--nav-on'];
  if(dark){
    v['--accent-text']=lightenFor(src,DARK_SURFACE,4.5);
    v['--page-bg']=theme==='custom'?mix(custom.bg,DARK_PAGE,.9):DARK_PAGE;
    v['--welcome']=`linear-gradient(110deg,${accentDark},${accent})`;
  }else{
    v['--accent-text']=darkenFor(accentDark,'#FFFFFF',4.5);
    if(theme==='alegre'){v['--page-bg']='linear-gradient(135deg,#FFF3C4 0%,#FFE3EE 48%,#D9F6F0 100%)';v['--welcome']='linear-gradient(110deg,#6D28D9,#C026D3 52%,#E8590C)'}
    else{let bg=custom.bg;if(relLum(bg)<.72)bg=lightenFor(bg,'#000000',15.5);v['--page-bg']=bg;v['--welcome']=`linear-gradient(110deg,${accentDark},${accent})`}
  }
  v['--tint']=dark?DARK_PAGE:(theme==='custom'?custom.bg:'#FFF8E7');
  return {dark,vars:v};
}
let appliedVars=[];
function applyTheme(theme,custom){
  theme=theme||state.settings.theme;custom=custom||state.settings.custom;
  const b=document.body,t=themeVars(theme,custom);
  appliedVars.forEach(k=>b.style.removeProperty(k));appliedVars=[];
  b.classList.remove('themed','theme-dark','theme-alegre');
  b.dataset.theme=theme+(theme==='custom'?JSON.stringify(custom):'');
  if(!t)return;
  for(const [k,v] of Object.entries(t.vars)){b.style.setProperty(k,v);appliedVars.push(k)}
  b.classList.add('themed');if(t.dark)b.classList.add('theme-dark');if(theme==='alegre')b.classList.add('theme-alegre');
}
function setTheme(id){
  if(!THEME_IDS.includes(id))return;
  state.settings.theme=id;save();applyTheme();render();
  notify(`Tema «${THEMES.find(t=>t.id===id).name}» aplicado. Puedes cambiarlo cuando quieras.`,'success',{ms:4000});
}
function setCustom(key,val){
  const c=state.settings.custom;
  if(key==='base'){if(!['light','dark'].includes(val))return;c.base=val}
  else{if(!HEX_RE.test(val||''))return;c[key]=val.toUpperCase()}
  state.settings.theme='custom';save();applyTheme();
  /* sólo se redibuja el panel de colores para no perder el selector abierto */
  const box=document.getElementById('themeBox');if(box)box.outerHTML=themePanelHTML();
}
function resetCustom(){state.settings.custom=defaultCustom();state.settings.theme='custom';save();applyTheme();render();notify('Colores personalizados restablecidos.','info',{ms:4000})}

  const t=themeVars(id,state.settings.custom),acc=t?t.vars['--accent']:EDITION_ACCENT[EDITION].main,dark=t&&t.dark;

  return `<span class="th-thumb" aria-hidden="true" style="background:${page}"><span class="th-bar" style="background:${surf};border-bottom:3px solid ${t?t.vars['--brand']:acc}"><i style="background:${acc}"></i><i style="background:${line}"></i><i style="background:${line}"></i></span><span class="th-card" style="background:${surf};border-color:${line}"><b style="background:${ink}"></b><span>${(dark?['#1C4A35','#4A3D10','#57222F']:['#D5F0E0','#FFF0B8','#FFD3D8']).map(c=>`<i style="background:${c}"></i>`).join('')}</span><em style="background:${acc}"></em></span></span>`;

    <div class="cc-row"><b>Fondo</b><div class="swatches">${BG_SWATCHES.map(h=>`<button class="sw bg ${c.bg===h?'on':''}" style="background:${h}" onclick="setCustom('bg','${h}')" aria-label="Fondo ${h}" aria-pressed="${c.bg===h}"></button>`).join('')}<label class="sw-pick">Otro <input type="color" id="ccBg" value="${c.bg}" oninput="setCustom('bg',this.value)" aria-label="Elegir otro color de fondo"></label></div></div>

    <div class="actions"><button class="secondary" onclick="resetCustom()">Restablecer mis colores</button><span class="helper">Los cambios se ven al momento y se guardan solos.</span></div></div>`:''}
  <p class="helper">Los colores de calificación (verde, amarillo y rojo) no cambian con el tema, para que siempre signifiquen lo mismo.</p></section>`;

  if(!activeGroups().some(g=>g.id===selectedGroup)){

function createGroup(name){
  const gr={id:gid(),name,level:EDITION,archived:false,students:[]};if(EDITION==='Secundaria')gr.disciplines=[];
  state.groups.push(gr);return gr;

function addGroup(){
  const n=document.getElementById('groupName').value.trim().slice(0,80);
  if(!n)return warn('Escribe el nombre del grupo.');
  if(groupNameTaken(n))return warn('Ya existe un grupo con ese nombre.');

function renameGroup(id){
  const g=state.groups.find(x=>x.id===id);if(!g)return;

function archiveGroup(id,on){
  const g=state.groups.find(x=>x.id===id);if(!g)return;

  <div class="flex"><input id="studentSearch" class="field grow" type="search" placeholder="Buscar alumno por nombre…" aria-label="Buscar alumno" oninput="filterStudents(this.value)" value="${esc(studentQuery)}"><span class="helper" id="studentCount">${ros.length} alumnos</span></div>
  <div class="table-wrap"><table class="rows" id="studentTable"><thead><tr><th>Nombre del alumno</th><th>Qué quieres hacer</th></tr></thead><tbody>${ros.map(s=>`<tr data-name="${esc(normName(s.name))}"><td>${esc(s.name)}</td><td><div class="flex"><button class="mini" onclick="openFicha('${s.id}')">Ver ficha</button><button class="mini" onclick="renameStudent('${s.id}')">Corregir nombre</button><button class="mini" onclick="removeStudent('${s.id}')">Retirar del grupo</button></div></td></tr>`).join('')||'<tr><td colspan="2" class="muted">Este grupo todavía no tiene alumnos. Elige tu lista de Excel arriba o escribe el primero.</td></tr>'}</tbody></table></div><div class="empty hidden" id="studentNoMatch">Ningún alumno coincide con la búsqueda.</div>
  ${baja.length?`<details class="import-panel"><summary>Alumnos retirados (${baja.length})</summary><p class="helper">Conservan su historial de asistencia y calificaciones, pero ya no aparecen en listas, cuaderno ni reportes.</p>${baja.map(s=>`<div class="flex review-item"><b>${esc(s.name)}</b><button class="secondary" onclick="reactivateStudent('${s.id}')">Regresar al grupo</button><button class="danger" onclick="purgeStudent('${s.id}')">Borrar para siempre</button></div>`).join('')}</details>`:''}`:emptyPanel('Primero crea un grupo.',`<div class="actions"><button class="primary big" onclick="switchTo('grupos')">Crear mi primer grupo</button></div>`)}</section>`;
  if(g&&studentQuery)filterStudents(studentQuery);
};
function filterStudents(q){
  studentQuery=q;const n=normName(q);let shown=0;
  document.querySelectorAll('#studentTable tbody tr[data-name]').forEach(tr=>{const hit=!n||tr.dataset.name.includes(n);tr.classList.toggle('hidden',!hit);if(hit)shown++});
  const cnt=document.getElementById('studentCount');if(cnt)cnt.textContent=(n?shown+' de ':'')+roster(group()).length+' alumnos';
  const nm=document.getElementById('studentNoMatch');if(nm)nm.classList.toggle('hidden',shown>0||!n);
}
function studentNameTaken(g,name,exceptId){const n=normName(name);return g.students.some(s=>s.id!==exceptId&&normName(s.name)===n)}
function sortRoster(g){g.students.sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}))}
function addStudent(){
  const g=group(),n=document.getElementById('studentName').value.trim().slice(0,130);
  if(!g||!n)return warn('Escribe el nombre del alumno.');
  if(studentNameTaken(g,n))return warn('Ese alumno ya está en este grupo (no importan mayúsculas ni acentos).');
  g.students.push({id:gid(),name:n});sortRoster(g);save();render();
  const f=document.getElementById('studentName');if(f)f.focus();
}
function renameStudent(id){
  const g=group(),s=g?.students.find(x=>x.id===id);if(!s)return;
  const n=prompt('Nombre del alumno:',s.name);if(n===null)return;
  const t=n.trim().slice(0,130);if(!t)return warn('El nombre no puede quedar vacío.');
  if(studentNameTaken(g,t,id))return warn('Ya hay otro alumno con ese nombre en este grupo.');
  s.name=t;sortRoster(g);save();render();notify('Nombre corregido. Sus notas y asistencias se conservan.','success');   /* el id no cambia */
}
/* Agrega varios nombres evitando repetidos; devuelve {added, skipped[]} */
function addStudentsBulk(g,names){
  const seen=new Set(g.students.map(x=>normName(x.name)));let added=0;const skipped=[];
  for(const raw of names){
    const name=String(raw).trim().replace(/\s+/g,' ');if(!name)continue;
    if(name.length>130){skipped.push(name.slice(0,30)+'…');continue}
    const k=normName(name);if(seen.has(k)){skipped.push(name);continue}
    g.students.push({id:gid(),name});seen.add(k);added++;
  }
  sortRoster(g);return {added,skipped};
}
function pasteStudents(){
  const g=group(),raw=document.getElementById('studentsPaste')?.value||'';if(!g)return;
  const rows=raw.split(/\r?\n/).map(x=>x.split('\t')[0].trim()).filter(Boolean).filter(x=>!/^(nombre|nombres|alumno|alumnos|nombre completo)$/i.test(x));
  if(!rows.length)return warn('Pega uno o más nombres.');
  const r=addStudentsBulk(g,rows);save();render();
  notify(r.added+' alumnos agregados.'+(r.skipped.length?`\n${r.skipped.length} omitidos por estar repetidos o ser muy largos:\n• `+r.skipped.slice(0,6).join('\n• ')+(r.skipped.length>6?'\n• …':''):''),r.added?'success':'info');
}
function removeStudent(id){
  const g=group(),s=g?.students.find(x=>x.id===id);if(!s)return;
  withUndo(`«${s.name}» salió del grupo (su historial se conserva)`,()=>{s.inactive=true});
}
function reactivateStudent(id){const s=group()?.students.find(x=>x.id===id);if(!s)return;delete s.inactive;save();render();notify(`«${s.name}» regresó al grupo.`,'success')}
function purgeStudent(id){
  const g=group(),s=g?.students.find(x=>x.id===id);if(!s||!s.inactive)return;
  const nGr=[state.grades,state.marks,state.rscores,state.obs].reduce((n,m)=>n+Object.keys(m).filter(k=>k.endsWith('|'+id)).length,0),nAt=Object.values(state.attendance).filter(r=>r[id]!==undefined).length;
  if(!confirm(`BORRAR PARA SIEMPRE a «${s.name}»\n\nSe borrarán sus ${nGr} calificaciones y sus ${nAt} registros de asistencia. Esto NO se puede deshacer.\n\nSi no estás seguro, toca Cancelar: puedes dejarlo como retirado.`))return;
  g.students=g.students.filter(x=>x.id!==id);
  for(const m of [state.grades,state.marks,state.rscores,state.obs])for(const k of Object.keys(m))if(k.endsWith('|'+id))delete m[k];
  for(const k of Object.keys(state.studentNotes))if(k.split('|')[1]===id)delete state.studentNotes[k];
  for(const k of Object.keys(state.attendance))delete state.attendance[k][id];
  delete state.extra[g.id+'|'+id];
  (state.teamSets[g.id]||[]).forEach(set=>set.teams.forEach(t=>{t.students=t.students.filter(x=>x!==id)}));
  state.attendanceLog=state.attendanceLog.filter(e=>e.s!==id);
  save();render();notify('Alumno borrado definitivamente.','info');
}

/* ---------- Asistencia: todos presentes por defecto; se toca sólo a quien faltó ---------- */
let attFlash='',attFocus='';
function attKey(g,d){return g.id+'|'+d}
function attStatusOf(g,date,sid){const rec=state.attendance[attKey(g,date)];return (rec&&rec[sid])||'P'}
function ensureRecord(g,date){
  const k=attKey(g,date);if(!state.attendance[k])state.attendance[k]={};const rec=state.attendance[k];
  roster(g).forEach(s=>{if(rec[s.id]===undefined)rec[s.id]='P'});return rec;
}

  const ros=roster(g),rec=g?state.attendance[attKey(g,currentDate)]:null,counts={P:0,F:0,FJ:0,FI:0};

  const isToday=currentDate===todayISO(),flash=attFlash;attFlash='';

  <div class="att-grid">${ros.map(s=>{const st=attStatusOf(g,currentDate,s.id),here=st==='P';return `<div class="att-card st-${st}" data-sid="${s.id}"><div class="att-name">${esc(s.name)}</div><button class="att-toggle" onclick="toggleAttendance('${s.id}')" aria-pressed="${!here}" aria-label="${esc(s.name)}: ${here?'presente. Tocar para marcar falta':'faltó. Tocar para marcar presente'}">${here?'✓ Presente':'✗ Faltó'}</button>${here?'':`<div class="att-sub" role="group" aria-label="Tipo de falta de ${esc(s.name)}"><span>La falta es:</span>${[['F','Sin clasificar'],['FJ','◐ Justificada'],['FI','! Injustificada']].map(([id,n])=>`<button class="att-btn ${st===id?'chosen '+id:''}" onclick="setAttendance('${s.id}','${id}')" aria-pressed="${st===id}">${n}</button>`).join('')}</div>`}</div>`}).join('')||'<div class="empty">Este grupo todavía no tiene alumnos.</div>'}</div>
  <div class="save-bar"><button class="primary big" onclick="saveList()" ${ros.length?'':'disabled'}>💾 Guardar lista</button><button class="secondary" onclick="downloadAttendance()">↓ Bajar lista en Excel (CSV)</button><button class="secondary" onclick="switchTo('historial')">Ver historial y porcentajes →</button></div>
  <p class="helper">Cada cambio se guarda solo y queda anotado en el historial de modificaciones. «Sin clasificar» significa que aún no decides si la falta es justificada o no.</p>`:emptyPanel('Primero crea un grupo.',`<div class="actions"><button class="primary big" onclick="switchTo('grupos')">Crear mi primer grupo</button></div>`)}</section>`;
  if(attFocus){const b=document.querySelector(`[data-sid="${attFocus}"] .att-toggle`);if(b)b.focus();attFocus=''}
};
function logAttendance(sid,from,to){
  if(from===to)return;
  state.attendanceLog.push({t:Date.now(),g:selectedGroup,d:currentDate,s:sid,from:from||'-',to});
  if(state.attendanceLog.length>3000)state.attendanceLog=state.attendanceLog.slice(-3000);
}
function toggleAttendance(sid){const g=group();if(!g)return;setAttendance(sid,attStatusOf(g,currentDate,sid)==='P'?'F':'P')}
function setAttendance(id,status){
  const g=group();if(!g||!ATT_CODES.includes(status))return;
  const rec=ensureRecord(g,currentDate);logAttendance(id,rec[id],status);rec[id]=status;save();attFocus=id;render();
}
function saveList(){
  const g=group();if(!g)return;const had=!!state.attendance[attKey(g,currentDate)];ensureRecord(g,currentDate);save();
  const ros=roster(g),f=ros.filter(s=>attStatusOf(g,currentDate,s.id)!=='P').length;
  attFlash=`Lista del ${fmtIso(currentDate)} ${had?'actualizada':'guardada'}: ${ros.length-f} presentes${f?` y ${f} con falta`:''}.`;render();
}
function downloadAttendance(){
  const g=group();if(!g)return;
  csvDownload('asistencia_'+safeName(g.name)+'_'+currentDate+'.csv',[['Alumno','Fecha','Estado'],...roster(g).map(s=>[s.name,currentDate,ATT_NAMES[attStatusOf(g,currentDate,s.id)]])]);
}

/* ---------- Historial de asistencia ---------- */
/* Para cada alumno sólo cuentan los días en que tiene registro (un alumno que llegó después no «debe» faltas anteriores) */
function attendanceStats(g,from,to){
  const days=Object.keys(state.attendance).filter(k=>k.startsWith(g.id+'|')).map(k=>k.split('|')[1]).filter(d=>(!from||d>=from)&&(!to||d<=to)).sort();
  const withJ=state.settings.attRule==='withJustified';
  return {days,rows:roster(g).map(s=>{
    const n={P:0,F:0,FJ:0,FI:0};let counted=0;
    days.forEach(d=>{const x=state.attendance[g.id+'|'+d][s.id];if(x===undefined)return;n[x]++;counted++});
    const assisted=n.P+(withJ?n.FJ:0);return {s,n,counted,pct:counted?Math.round(assisted/counted*100):null};
  })};
}
VIEWS.historial=function(c,g){
  title('PASAR LISTA','Historial de asistencia','Consulta las faltas de cada alumno y los cambios que hiciste.');
  if(!g){c.innerHTML=emptyPanel('Primero crea un grupo.');return}
  const st=attendanceStats(g,attRange.from,attRange.to),rule=state.settings.attRule,thr=state.settings.alertPct;
  const log=state.attendanceLog.filter(e=>e.g===g.id).slice(-50).reverse(),nameOf=id=>g.students.find(s=>s.id===id)?.name||'Alumno borrado';
  c.innerHTML=`<section class="panel"><div class="flex">${groupSelect()}<button class="secondary" onclick="downloadHistory()">↓ Bajar historial (CSV)</button></div>
  <div class="scope-controls"><div class="flex"><label class="label-inline">Desde <input class="field" type="date" value="${esc(attRange.from)}" onchange="attRange.from=this.value;render()"></label><label class="label-inline">Hasta <input class="field" type="date" value="${esc(attRange.to)}" onchange="attRange.to=this.value;render()"></label>${(attRange.from||attRange.to)?'<button class="mini" onclick="attRange={from:\'\',to:\'\'};render()">Quitar fechas</button>':''}</div>
  <div class="flex" style="margin-top:10px"><label class="label-inline">Cómo calcular el porcentaje <select class="field" onchange="setAttSetting('attRule',this.value)"><option value="strict" ${rule==='strict'?'selected':''}>Cuentan solo las asistencias</option><option value="withJustified" ${rule==='withJustified'?'selected':''}>Asistencias + faltas justificadas</option></select></label><label class="label-inline">Avisar si baja de <input class="field percent-input" type="number" min="1" max="100" value="${thr}" onchange="setAttSetting('alertPct',this.value)"> %</label></div></div>
  <p class="hint">El porcentaje = ${rule==='strict'?'asistencias':'asistencias + faltas justificadas'} ÷ días con lista${(attRange.from||attRange.to)?' en las fechas elegidas':''}. Tú decides la regla: el programa <b>no reprueba ni sanciona automáticamente</b>.</p>
  <div class="table-wrap"><table class="rows"><thead><tr><th>Alumno</th><th>Asistencias</th><th>Faltas</th><th>Justificadas</th><th>Injustificadas</th><th>% asistencia</th></tr></thead><tbody>${st.rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${r.n.P}</td><td>${r.n.F}</td><td>${r.n.FJ}</td><td>${r.n.FI}</td><td><b>${r.pct===null?'—':r.pct+'%'}</b>${r.pct!==null&&r.pct<thr?` <span class="chip bad">⚠ Menos de ${thr}%</span>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Este grupo todavía no tiene alumnos.</td></tr>'}</tbody></table></div>
  <p class="helper">Días con lista: ${st.days.length}. Para agregar un día, ve a «Pasar lista».</p>
  <details class="import-panel"><summary>Cambios que hiciste (últimos ${log.length})</summary>${log.length?`<div class="table-wrap"><table class="rows"><thead><tr><th>Cuándo</th><th>Lista del día</th><th>Alumno</th><th>Cambio</th></tr></thead><tbody>${log.map(e=>`<tr><td>${esc(new Date(e.t).toLocaleString('es-MX'))}</td><td>${esc(fmtIso(e.d))}</td><td>${esc(nameOf(e.s))}</td><td>${e.from==='-'?'Registro inicial':esc(ATT_NAMES[e.from])} → <b>${esc(ATT_NAMES[e.to])}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay cambios anotados.</p>'}</details></section>`;
};
function setAttSetting(key,val){
  if(key==='attRule')state.settings.attRule=val==='withJustified'?'withJustified':'strict';
  if(key==='alertPct'){const n=Math.round(Number(val));if(!Number.isFinite(n)||n<1||n>100){warn('Escribe un porcentaje entre 1 y 100.');render();return}state.settings.alertPct=n}
  save();render();
}
function downloadHistory(){
  const g=group();if(!g)return;const st=attendanceStats(g,attRange.from,attRange.to),rule=state.settings.attRule==='withJustified'?'Asistencia + justificadas':'Solo asistencia';
  csvDownload('historial_asistencia_'+safeName(g.name)+'.csv',[['Grupo',g.name],['Días con lista',st.days.length],['Desde',attRange.from||'inicio'],['Hasta',attRange.to||'hoy'],['Regla del porcentaje',rule],[],
    ['Alumno','Asistencias','Faltas','Justificadas','Injustificadas','% asistencia'],...st.rows.map(r=>[r.s.name,r.n.P,r.n.F,r.n.FJ,r.n.FI,r.pct===null?'':r.pct])]);
}

/* ===== 52_wizard.js — asistente de bienvenida (3 pasos) ===== */
function defaultCycle(){const d=new Date(),y=d.getFullYear();return d.getMonth()>=7?`${y}-${y+1}`:`${y-1}-${y}`}
let wiz={step:1,teacher:'',school:'',cycle:defaultCycle(),group:'',disc:[],names:[],fileName:''};

function wizRead(){
  const v=id=>document.getElementById(id)?.value;
  if(wiz.step===1){wiz.teacher=(v('wTeacher')??wiz.teacher).trim();wiz.school=(v('wSchool')??wiz.school).trim();wiz.cycle=(v('wCycle')??wiz.cycle).trim()}
  if(wiz.step===2){wiz.group=(v('wGroup')??wiz.group).trim();if(EDITION==='Secundaria'&&document.querySelector('[data-wdisc]'))wiz.disc=[...document.querySelectorAll('[data-wdisc]:checked')].map(x=>x.dataset.wdisc)}
}
function wizNext(){
  wizRead();
  if(wiz.step===1&&!wiz.teacher)return warn('Escribe tu nombre para continuar.');
  if(wiz.step===2){
    if(!wiz.group)return warn('Escribe el nombre de tu grupo, por ejemplo 5° A.');
    if(EDITION==='Secundaria'&&!wiz.disc.length)return warn('Marca al menos una disciplina que impartas a este grupo.');
  }
  wiz.step=Math.min(3,wiz.step+1);render();window.scrollTo(0,0);
}
function wizBack(){wizRead();wiz.step=Math.max(1,wiz.step-1);render()}
function wizSetNames(names,fileName){wiz.names=names;wiz.fileName=fileName||'';render()}
function wizSkip(){state.profile.onboarded=true;save();notify('Puedes explorar con el grupo de demostración. Cuando quieras, crea tu grupo en «Mi grupo».','info',{ms:12000});render()}
function wizFinish(){
  wizRead();
  if(!wiz.group)return warn('Falta el nombre del grupo.');
  const demo=state.groups.filter(g=>['g1','g2'].includes(g.id)&&!state.activities.some(a=>a.groupId===g.id)&&!Object.keys(state.attendance).some(k=>k.startsWith(g.id+'|')));
  if(groupNameTaken(wiz.group)&&!demo.some(d=>normName(d.name)===normName(wiz.group)))return warn('Ya existe un grupo con ese nombre.');
  state.groups=state.groups.filter(g=>!demo.includes(g));
  const gr=createGroup(wiz.group.slice(0,80));
  if(EDITION==='Secundaria')gr.disciplines=wiz.disc.filter(d=>DISCIPLINAS.some(x=>x.id===d));
  const pasted=(document.getElementById('wPaste')?.value||'').split(/\r?\n/).map(x=>x.split('\t')[0].trim()).filter(Boolean);
  const r=addStudentsBulk(gr,[...wiz.names,...pasted]);
  const p=state.profile;p.teacher=wiz.teacher.slice(0,120);p.school=wiz.school.slice(0,160);p.cycle=wiz.cycle.slice(0,20);
  if(EDITION==='Primaria'){const m=/^\s*([1-6])/.exec(wiz.group);if(m)p.grade=m[1]+'°';p.group=gr.id}
  p.onboarded=true;selectedGroup=gr.id;scopeByGroup={};save();
  const n=wiz.names=[];wiz={step:1,teacher:'',school:'',cycle:defaultCycle(),group:'',disc:[],names:[],fileName:''};
  switchTo('inicio');
  notify(`¡Todo listo! Tu grupo «${gr.name}» tiene ${r.added} alumnos.`+(r.added?'':' Agrégalos en «Mi grupo» cuando quieras.'),'success',{ms:10000});
}

function setTeamMode(m){tdraft().mode=m;render()}
function d_sel(i){const d=tdraft();d.sel=i;d.picks.clear();render()}

function assignSelected(){
  const d=tdraft();if(!d.manual[d.sel])return;

}
function unassign(i,id){const d=tdraft();d.manual[i].students=d.manual[i].students.filter(x=>x!==id);render()}
function renameTeam(i){const d=tdraft(),n=prompt('Nombre del equipo:',d.manual[i].name);if(n?.trim()){d.manual[i].name=n.trim().slice(0,60);render()}}
function resetTeams(){const d=tdraft();d.manual=[{name:'Equipo 1',students:[]}];d.sel=0;d.picks.clear();d.auto=null;render()}
function autoTeams(){
  const g=group();if(!g)return;const d=tdraft(),students=[...roster(g)];
  if(!students.length)return warn('Este grupo aún no tiene alumnos.');
  for(let i=students.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[students[i],students[j]]=[students[j],students[i]]}
  const size=d.size,count=Math.max(1,Math.ceil(students.length/size)),teams=Array.from({length:count},(_,i)=>({name:'Equipo '+(i+1),students:[]}));
  students.forEach((s,i)=>teams[i%count].students.push(s.id));

}

function rubroFieldHTML(p,g,sc,a){

let rubroLast={};
function afRubro(p){const sel=document.getElementById(p+'Type'),box=document.getElementById(p+'NewRubBox');if(!sel||!box)return;box.hidden=sel.value!=='__new';if(!box.hidden)document.getElementById(p+'NewRub')?.focus()}
function addRubro(g,sc,name){
  const k=rubroKey(g,sc);if(!state.rubros[k])state.rubros[k]=copy(defaultRubros());const R=state.rubros[k];
  const same=R.items.find(it=>normName(it.name)===normName(name));if(same)return same.id;
  if(R.items.length>=12){warn(SCOPE_W.max+' hasta 12 rubros.');return null}
  const it={id:gid(),name:name.slice(0,40),w:0};R.items.push(it);
  if(R.pct)notify(`Rubro «${it.name}» agregado con 0 %. Ponle su porcentaje en Opciones del cuaderno › Rubros y porcentajes; mientras tanto no cuenta en el promedio.`,'info',{ms:14000});
  return it.id;

function afMode(p){
  const f=document.getElementById(p+'Form');if(!f)return;const m=document.getElementById(p+'Mode').value;
  const show={type:m!=='text',max:m==='num',rub:m==='rubric',counts:m==='icon'||m==='level',pda:m!=='text'};
  f.querySelectorAll('[data-af]').forEach(el=>{el.hidden=!show[el.dataset.af]});
  const h=document.getElementById(p+'Hint');if(h)h.textContent=MODES.find(x=>x.id===m)?.hint||'';

function readActivityForm(p,g,a){
  const v=id=>document.getElementById(p+id),name=(v('Name')?.value||'').trim().slice(0,120),mode=v('Mode')?.value||'num';
  const type='Actividad',max=mode==='num'?Number(v('Max')?.value):10,date=v('Date')?v('Date').value:todayISO();
  if(!name)return {ok:false,msg:'Escribe el nombre de la actividad.'};
  if(!MODE_IDS.includes(mode))return {ok:false,msg:'Elige cómo se califica.'};
  if(!Number.isFinite(max)||max<1||max>100)return {ok:false,msg:'El puntaje máximo debe ser un número entre 1 y 100.'};
  if(!DATE_RE.test(date||''))return {ok:false,msg:'Revisa la fecha.'};
  const needRub=mode==='rubric'&&!(a&&modeOf(a)==='rubric'),rubricId=needRub?v('Rub')?.value:'';
  if(needRub&&!rubricById(rubricId))return {ok:false,msg:'Elige la rúbrica o lista de cotejo con la que vas a evaluar.'};
  const sc=a?a.scopeId:scopeId(g),valid=new Set(pdaList(g,sc).map(x=>x.id));
  const pdas=mode==='text'?[]:[...document.querySelectorAll(`#${p}Form input[name="${p}Pda"]:checked`)].map(x=>x.value).filter(x=>valid.has(x));
  let rubro='',newRubro='';
  {
    const R=rubrosOf(g,sc);rubro=v('Type')?.value||'';
    if(mode==='text')rubro=a?a.rubro:R.items[0].id;
    else if(rubro==='__new'){newRubro=(v('NewRub')?.value||'').replace(/\s+/g,' ').trim();if(!newRubro)return {ok:false,msg:'Escribe el nombre del nuevo rubro.'};rubro=''}
    else if(!R.items.some(it=>it.id===rubro))return {ok:false,msg:'Elige el rubro de la actividad.'};
  }
  return {ok:true,data:{name,mode,type,max,date,rubricId,counts:(mode==='icon'||mode==='level')?!!v('Counts')?.checked:true,pdas,rubro,newRubro}};
}
function resolveRubro(g,sc,d){return d.newRubro?addRubro(g,sc,d.newRubro):d.rubro}
function rubricSnapshot(id){const r=normalizeRubric(copy(rubricById(id)));r.criteria.forEach(c=>{c.pda=''});return r}
function createActivity(g,d){

  {const r=resolveRubro(g,a.scopeId,d);if(!r)return null;a.rubro=r;rubroLast[rubroKey(g,a.scopeId)]=r}

function pdaChips(g,a){

function progressChip(a,sid){

  if(m==='text')return state.obs[a.id+'|'+sid]?'<span class="chip ok">Con nota</span>':'<span class="chip">Sin nota</span>';
  if(m==='rubric'){const r=rubricResult(a,sid);return r.frac!==null?`<span class="chip ok">${Math.round(r.frac*100)}%</span>`:r.done?`<span class="chip warnchip">${r.done} de ${r.total} criterios</span>`:'<span class="chip">Pendiente</span>'}

function addActivity(){

}
function saveActivityEdit(id){
  const a=state.activities.find(x=>x.id===id),g=group();if(!a||!g)return;
  const r=readActivityForm('e',g,a);if(!r.ok)return warn(r.msg);const d=r.data,notes=(document.getElementById('eNotes')?.value||'').trim().slice(0,500);
  if(d.mode!==modeOf(a)&&activityHasData(a))return warn('Esta actividad ya tiene calificaciones: para calificarla de otra forma, crea una actividad nueva.');
  if(d.mode==='num'){
    const top=Math.max(0,...Object.keys(state.grades).filter(k=>k.startsWith(id+'|')).map(k=>state.grades[k]));
    if(d.max<top)return warn(`Hay una calificación de ${numfmt(top)} registrada; el puntaje máximo no puede ser menor.`);
  }
  if(d.mode==='rubric'&&modeOf(a)!=='rubric'){a.rubric=rubricSnapshot(d.rubricId);a.rubricFrom=rubricById(d.rubricId).name}
  if(d.mode!=='rubric'){delete a.rubric;delete a.rubricFrom}
  {const r=resolveRubro(g,a.scopeId,d);if(!r)return;a.rubro=r}
  Object.assign(a,{name:d.name,date:d.date,max:d.max,mode:d.mode,counts:d.counts,pdas:pdaEnabled()?d.pdas:(a.pdas||[]),notes});editingActivity='';save();render();
}
function archiveActivity(id,on){

}
function classifyActivity(id){
  const g=group(),a=state.activities.find(a=>a.id===id&&a.groupId===selectedGroup),choice=document.getElementById('migrate_'+id)?.value;
  if(!a||!choice||!scopesForGroup(g).some(x=>x.id===choice))return warn('Selecciona un campo o disciplina.');
  a.scopeId=choice;a.period=String(a.period||'1');a.type=a.type||'Actividad';{const L=rubrosOf(g,choice).items;if(!L.some(x=>x.id===a.rubro))a.rubro=(L.find(x=>x.id===TIPO_TO_RUBRO[a.type])||L[0]).id}scopeByGroup[g.id]=choice;currentPeriod=String(a.period);gradeActivityId=a.id;save();render();
}
/* Captura de notas: se actualiza sólo la fila (sin volver a dibujar la tabla) para no perder el foco al pulsar Tab/Enter */
function setGrade(aid,sid,input){
  const a=state.activities.find(a=>a.id===aid);if(!a)return;const key=aid+'|'+sid,raw=input.value;
  if(raw.trim()===''){delete state.grades[key]}
  else{
    const n=Number(raw);
    if(!Number.isFinite(n)||n<0||n>a.max){warn('La nota debe estar entre 0 y '+a.max);const prev=state.grades[key];input.value=prev===undefined?'':prev;return}
    state.grades[key]=n;

function gradeKey(e){
  if(e.key!=='Enter')return;e.preventDefault();
  const inputs=[...document.querySelectorAll('input.grade-input')],i=inputs.indexOf(e.target);

  (inputs[i+1]||inputs[i]).focus();
}
function deleteActivity(id){
  if(!confirm('¿Eliminar esta actividad y sus calificaciones? Esta acción no se puede deshacer.\n\nSi sólo quieres que deje de contar, usa «Ocultar».'))return;

}
function downloadGrades(){
  const g=group();if(!g)return;const arr=scopedActivities(g),sc={id:scopeId(g)};
